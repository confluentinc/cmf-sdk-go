    SavepointsPage:
      allOf:
      - $ref: '#/components/schemas/PaginationResponse'
      - $ref: '#/components/schemas/SavepointsPage_allOf'
      type: object
    StatementStartFromSavepoint:
      description: Configuration for resuming a Statement from a savepoint. Works
        only with update Statement.
      properties:
        savepointName:
          description: The name of the Savepoint resource to start Statement from.
            The request will be rejected if savepoint that has not completed is referenced.
          type: string
        uid:
          description: The uuid of the Savepoint resource to start from.
          type: string
        initialSavepointPath:
          description: The path of the savepoint to start the Statement from. This
            could be an external path too.
          type: string
        allowNonRestoredState:
          description: A boolean flag to allow the job to start even if some state
            could not be restored.
          type: boolean
        savepointRedeployNonce:
          description: Nonce used to trigger a full redeployment of the job from the
            savepoint. In order to trigger redeployment, change the number to a different
            non-null value. Rollback is not possible after redeployment.
          format: int64
          type: integer
      title: StartStatementFromSavepoint
      type: object
    SystemInformation:
      description: Represents system information about the CMF application
      example:
        status:
          version: version
          revision: revision
      properties:
        status:
          $ref: '#/components/schemas/SystemInformationStatus'
      title: SystemInformation
      type: object
    AuthConfig:
      description: |-
        Authentication/authorization configuration advertised to the cmf-ui SPA so it
        can decide whether and how to log in before it holds a token.
      example:
        ssoEnabled: true
        tokenMaxLifeSeconds: 0
        authnEnabled: true
        basicAuthEnabled: true
        authzEnabled: true
      properties:
        authnEnabled:
          description: Whether incoming requests are authenticated by CMF.
          type: boolean
        authzEnabled:
          description: Whether CMF enforces fine-grained Flink authorization (RBAC).
          type: boolean
        ssoEnabled:
          description: |-
            Whether an OIDC/SSO login flow is available, advertised so the SPA shows the
            SSO login affordance. Set via cmf.ui.auth.sso-enabled; only meaningful when
            authnEnabled is true.
          type: boolean
        basicAuthEnabled:
          description: |-
            Whether a Basic username/password login flow is available, advertised so the
            SPA shows the username/password form. Set via cmf.ui.auth.basic-auth-enabled;
            only meaningful when authnEnabled is true.
          type: boolean
        tokenMaxLifeSeconds:
          description: |-
            Maximum lifetime, in seconds, of a token issued by the login flow, used to
            schedule client-side refresh. Sourced from cmf.ui.auth.token-max-life-seconds;
            null until then.
          format: int64
          type: integer
      title: AuthConfig
      type: object
    WhoAmi:
      description: |-
        The principal CMF authenticated the current request as, for the cmf-ui SPA to display
        (e.g. in the top-bar user menu).
      example:
        principal: principal
        authMethod: certificate
      properties:
        principal:
          description: |-
            The authenticated principal name -- the JWT subject for token/OIDC/Basic logins, or
            the mTLS client-certificate subject mapped to a principal. Null when the request is
            not authenticated (authentication disabled).
          nullable: true
          type: string
        authMethod:
          description: |-
            How the request was authenticated: "certificate" when the identity came from the
            TLS client certificate, "token" when it came from an HTTP credential (a bearer
            token, a session cookie, or basic credentials). Null when the request is not
            authenticated. In deployments that combine mTLS with token authentication, a
            request carrying a token authenticates as the token's principal and reports
            "token"; the client certificate then only secures the transport.
          enum:
          - certificate
          - token
          nullable: true
          type: string
      title: WhoAmi
      type: object
    C3LicenseInformation:
      description: License information for C3 integration
      example:
        kind: kind
        status:
          licenseType: licenseType
          expiration: 0
          status: status
      properties:
        kind:
          type: string
        status:
          $ref: '#/components/schemas/C3LicenseInformationStatus'
      title: C3LicenseInformation
      type: object
    C3Configuration:
      description: Effective runtime configuration of the CMF instance.
      example:
        kind: kind
        status:
          configurationProperties:
          - originType: CONFIG_FILE
            origin: origin
            sensitive: true
            value: value
            key: key
          - originType: CONFIG_FILE
            origin: origin
            sensitive: true
            value: value
            key: key
      properties:
        kind:
          type: string
        status:
          $ref: '#/components/schemas/C3ConfigurationStatus'
      title: C3Configuration
      type: object
    C3ConfigurationProperty:
      description: A single effective configuration entry.
      example:
        originType: CONFIG_FILE
        origin: origin
        sensitive: true
        value: value
        key: key
      properties:
        key:
          description: Property key in dotted form (e.g. cmf.k8s.enabled).
          type: string
        value:
          description: |
            Effective value as a string. `null` when the property has no
            resolvable value. Sensitive values are replaced with `******`.
          nullable: true
          type: string
        origin:
          description: |
            Best-effort, human-readable source detail for display (e.g. a config file with line:column, or `default` when unset). Formats may change between releases; use `originType` for logic.
          type: string
        originType:
          description: Coarse, stable category of `origin` (how the value was supplied),
            for grouping or filtering.
          enum:
          - CONFIG_FILE
          - ENVIRONMENT_VARIABLE
          - COMMAND_LINE
          - BUILT_IN_DEFAULT
          - OTHER
          type: string
        sensitive:
          description: |
            True if the value was masked because it looks like a credential.
            Use this flag rather than comparing the value to `******`, so a
            value that legitimately equals `******` is not mistaken for a
            masked one.
          type: boolean
      title: C3ConfigurationProperty
      type: object
    ResourceInformation:
      description: Represents resource information and usage statistics for the CMF
        application
      example:
        status:
          resourceSummary:
            memory: 9
            cpu: 7.061401241503109
          resources:
            detachedSavepoints: 2
            computePools: 6
            environments: 0
            catalogs: 5
