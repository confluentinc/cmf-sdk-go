    delete:
      description: 'For a dedicated compute pool, deletion completes immediately.
        For a shared compute pool, a successful response only means the deletion request
        was accepted: the compute pool remains readable, with `deletionRequestedTimestamp`
        set in its metadata, until the underlying Kubernetes resources have actually
        been removed -- at which point it stops being returned by this API.'
