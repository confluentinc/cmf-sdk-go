    ArtifactMetadata:
      description: Metadata about the Artifact
      properties:
        name:
          description: |
            Unique identifier of the Artifact within the Environment. Lowercase alphanumeric
            characters and hyphens, starting with a letter and ending with a letter or digit,
            optionally followed by a single `.` file extension (for example `my-udf` or
            `my-udf.jar`). Maximum 45 characters. The extension is reflected in the stored
            object's path; an Artifact referenced as a SQL UDF must be named with a `.jar`
            extension.
          maxLength: 45
          minLength: 1
          pattern: ^[a-z]([-a-z\d]*[a-z\d])?(\.[a-z\d]+)?$
          type: string
        uid:
          description: Unique identifier of the Artifact
          readOnly: true
          type: string
        creationTimestamp:
          description: Timestamp when the Artifact was first uploaded
          readOnly: true
          type: string
        updateTimestamp:
          description: Timestamp when the Artifact was last updated
          readOnly: true
          type: string
        labels:
          additionalProperties:
            type: string
          description: |
            Labels of the Artifact. Omit the field (or send
            null) to leave existing labels unchanged; send an empty
            object to clear them.
          nullable: true
          type: object
        annotations:
          additionalProperties:
            type: string
          description: |
            Annotations of the Artifact. Omit the field (or
            send null) to leave existing annotations unchanged; send an
            empty object to clear them.
          nullable: true
          type: object
      required:
      - name
      title: ArtifactMetadata
      type: object
