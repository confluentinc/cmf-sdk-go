    SystemInformationStatus:
      example:
        authorizationMode: NONE
        version: version
        revision: revision
        cmfClusterId: cmfClusterId
      properties:
        version:
          description: Version of the CMF application
          type: string
        revision:
          description: Git commit hash of the CMF application
          type: string
        cmfClusterId:
          description: Identifier of this CMF instance in its authorization cluster
            scope. Pass this as the `cmf` key in the `clusters` object of any Metadata
            Service RBAC request addressed to this CMF instance (for example the Confluent
            CLI's `--cmf` flag). Null when authorizationMode is NONE.
          nullable: true
          type: string
        authorizationMode:
          description: 'How this CMF instance resolves RBAC authorization decisions.
            NONE -- authorization is not configured, or is configured but not enforced
            (cmf.authorization.enforce: false). CMF -- CMF''s own embedded Metadata
            Service makes authorization decisions. CP_MDS -- an external Metadata
            Service makes authorization decisions. MIGRATION -- an external Metadata
            Service still makes authorization decisions, while CMF''s embedded Metadata
            Service is also running so role bindings can be prepared ahead of switching
            to CMF.'
          enum:
          - NONE
          - CMF
          - CP_MDS
          - MIGRATION
          type: string
      title: SystemInformationStatus
      type: object
    MetadataSyncStatus:
      description: |-
        Progress of the restore of managed resources that CMF performs after a
        restart.
        While this is running, some requests that change managed resources are
        rejected with 503: including creating, updating or deleting an application,
        a statement, a compute pool or an environment; starting or suspending an
        application; and creating or deleting a savepoint, individually or in bulk.
        Requests that don't result in changes are unaffected, including most read
        operations.

        Absent when CMF has performed no restore since it started, which is the
        case when the restore is turned off by configuration.
      example:
        completedAt: 2000-01-23T04:56:07.000+00:00
        startedAt: 2000-01-23T04:56:07.000+00:00
        state: IN_PROGRESS
      properties:
        state:
          description: Whether the restore is still running.
          enum:
          - IN_PROGRESS
          - COMPLETED
          - FAILED
          type: string
        startedAt:
          description: When the restore began.
          format: date-time
          type: string
        completedAt:
          description: Absent while the restore is still running.
          format: date-time
          type: string
      required:
      - startedAt
      - state
      title: MetadataSyncStatus
      type: object
