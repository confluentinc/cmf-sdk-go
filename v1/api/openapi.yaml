        application/yaml:
          schema:
            $ref: '#/components/schemas/RestError'
      description: Bad request.
    UnprocessableEntity:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RestError'
        application/yaml:
          schema:
            $ref: '#/components/schemas/RestError'
      description: Request valid but invalid content.
    MetadataSyncInProgress:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RestError'
        application/yaml:
          schema:
            $ref: '#/components/schemas/RestError'
      description: CMF is restoring the resources it manages after a restart and cannot
        accept this request yet. Retry shortly. The message names the resource that
        was refused. Requests that do not change managed resources are unaffected.
        The progress of the restore is reported by the system information endpoint.
    EnvironmentBeingDeleted:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RestError'
        application/yaml:
          schema:
            $ref: '#/components/schemas/RestError'
      description: The Environment is being deleted together with everything in it,
        so neither it nor anything in it can be created or updated.
    NotModified:
      description: Not modified.
      headers:
        ETag:
          description: An ID for this version of the response.
          explode: false
          schema:
            type: string
          style: simple
  schemas:
    RestError:
      description: The schema for all error responses.
      properties:
        errors:
          description: List of all errors
          items:
            $ref: '#/components/schemas/error'
          title: errors
          type: array
      title: REST Error
      type: object
    PaginationResponse:
