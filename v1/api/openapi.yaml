  /cmf/api/v1/environments/{envName}/applications/{appName}/pod-logs:
    get:
      description: |-
        Returns the most recent log output of a single JobManager or TaskManager pod of the Application, together with the names of all pods of that component so a caller can request the logs of a specific one. This is a point-in-time snapshot, not a live stream.

        For a live tail that stays open and delivers each new line as the container writes it, use `GET /cmf/api/v1/environments/{envName}/applications/{appName}/pod-logs/stream`. It takes the same `component` (required), `podName`, `container`, `tailLines`, `sinceTime` and `timestamps` parameters, requires the same permission, and returns a plain-text stream rather than a JSON snapshot.

        Log retrieval requires a connection to the Kubernetes cluster the Application runs on, and can be turned off entirely by the operator, in which case this endpoint responds with 404.
      operationId: getPodLogs
      parameters:
      - description: Name of the Environment
        explode: false
        in: path
        name: envName
        required: true
        schema:
          type: string
        style: simple
      - description: Name of the Application
        explode: false
        in: path
        name: appName
        required: true
        schema:
          type: string
        style: simple
      - description: Which component of the Flink cluster to read the logs of.
        explode: true
        in: query
        name: component
        required: true
        schema:
          enum:
          - jobmanager
          - taskmanager
          type: string
        style: form
      - description: Name of the pod to read the logs of. Must be one of the pods
          reported in `availablePods`. When omitted, the logs of the first available
          pod of the requested component are returned.
        explode: true
        in: query
        name: podName
        required: false
        schema:
          type: string
        style: form
      - description: Name of the container within the pod to read the logs of. Must
          be one of the containers of that pod. When omitted, the pod's main Flink
          container is used.
        explode: true
        in: query
        name: container
        required: false
        schema:
          type: string
        style: form
      - description: Number of most recent log lines to return. Ignored when `fromStart`
          is set.
        explode: true
        in: query
        name: tailLines
        required: false
        schema:
          default: 200
          maximum: 20000
          minimum: 1
          type: integer
        style: form
      - description: Only return log lines written within the last N seconds. The
          `tailLines` cap still applies, so a wide window can still be truncated.
        explode: true
        in: query
        name: sinceSeconds
        required: false
        schema:
          minimum: 0
          type: integer
        style: form
      - description: Only return log lines written at or after this timestamp (RFC
          3339). Use it together with `timestamps` to continue reading where a previous
          response ended. Mutually exclusive with `sinceSeconds`.
        explode: true
        in: query
        name: sinceTime
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: Prefix every returned line with the RFC 3339 timestamp at which
          the container wrote it.
        explode: true
        in: query
        name: timestamps
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: Return the log from the oldest line the Kubernetes cluster still
          retains instead of the most recent ones. The response is capped in size;
          `truncated` reports whether it hit that cap.
        explode: true
        in: query
        name: fromStart
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: Read the logs of the previous, terminated container instead of
          the running one. Use this to inspect why a container crashed.
        explode: true
        in: query
        name: previous
        required: false
        schema:
          default: false
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubernetesPodLogs'
            application/yaml:
              schema:
                $ref: '#/components/schemas/KubernetesPodLogs'
          description: Logs found and returned.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: Bad request.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: The caller may not view the Application.
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: The platform itself is not permitted to read the pod's logs
            on the Kubernetes cluster.
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: Environment, Application or pod not found, the Application
            currently has no pods of the requested component, a Flink cluster with
            the Application's name that is not the Application's own runs in its namespace,
            or log retrieval is disabled.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: Server error.
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: The Kubernetes cluster the Application runs on is currently
            unreachable.
      summary: Get a snapshot of the container logs of one of the Application's pods
      tags:
      - FlinkApplications
  /cmf/api/v1/environments/{envName}/applications/{appName}/pods:
    get:
      description: |-
        Returns one entry per JobManager and TaskManager pod of the Application, with the state Kubernetes reports for the pod and each of its containers. Use it to pick a pod and container to read logs from, and to see restarts and readiness at a glance.

        This requires a connection to the Kubernetes cluster the Application runs on, and is turned off together with log retrieval, in which case this endpoint responds with 404.

        The result is a live read of Kubernetes, bounded to the Application's own pods (one JobManager and its TaskManagers), with the standard `sort`, pagination, `fields` and `filter` parameters applied to that set. Because the pods come straight from the cluster rather than the database, `filter` supports name matching only (for example `name=my-app-taskmanager-*`); a `filter` on labels, phase or other fields is rejected with 400.
      operationId: listApplicationPods
      parameters:
      - description: Zero-based page index (0..N)
        explode: true
        in: query
        name: page
        required: false
        schema:
          type: integer
        style: form
      - description: The size of the page to be returned
        explode: true
        in: query
        name: size
        required: false
        schema:
          type: integer
        style: form
      - description: |-
          Sorting criteria in the format: property,(asc|desc). Default sort order is ascending.
          Multiple sort criteria are supported.
        explode: true
        in: query
        name: sort
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      - description: |-
          Filter query string with comma-separated expressions. Supports:
          - Name filtering: name=foo*bar (wildcards allowed)
          - Label equality: labels.key = value or labels.key != value
          - Label set-based: labels.key in (value1, value2) or labels.key notin (value1, value2)
          - Label existence: labels.key (exists) or !labels.key (does not exist)
          - State filtering (Applications only): state=RUNNING or state in (RUNNING, FAILED) or state notin (RUNNING, FAILED)
          - Status error filtering (Applications only): status.error (the Application's status reports an error, i.e. status.error is set and not blank) or !status.error (it reports none). An Application can report an error while its state is not FAILED, for example while its job keeps restarting.
          - Phase filtering (Statements and ComputePools): phase=PENDING or phase in (PENDING, RUNNING) or phase notin (PENDING, RUNNING)
          - Type filtering (Events only): type=CMF_STATUS or type in (CMF_STATUS, JOB_STATUS) or type notin (CMF_STATUS, JOB_STATUS)
          - Severity filtering (Events only): severity=WARNING or severity in (INFO, WARNING) or severity notin (WARNING). Values: INFO, WARNING. Severity is independent of type, so the two can be combined to narrow further (e.g. type=JOB_STATUS,severity=WARNING). An unrecognized severity value is rejected with HTTP 400.
          - Cluster status filtering (Environments only): clusterStatus=CONNECTED or clusterStatus in (CONNECTED, DISCONNECTED) or clusterStatus notin (CONNECTED, DISCONNECTED). Values match the effective state of the backing Kubernetes cluster (CONNECTED, DISCONNECTED, DECOMMISSIONED).
          - Source filtering (Savepoints only): source=MANUAL or source in (MANUAL, SCHEDULE) or source notin (UPGRADE). Identifies how the savepoint was created. Values: MANUAL (triggered via API, CLI, or UI), UPGRADE (created during an application upgrade), SCHEDULE (created by a periodic savepoint schedule). An unrecognized source value is rejected with HTTP 400 (unlike state, which simply returns no matches for an unknown value).
          Example: ?filter=name=foo*bar,labels.environment in (production, qa),!labels.development
          Example (with state): ?filter=name=prod*,state in (RUNNING, FAILED)
          Example (with status.error): ?filter=status.error,labels.team=payments
          Example (with phase): ?filter=name=my-stmt*,phase in (PENDING, RUNNING)
          Example (with type): ?filter=type=CMF_STATUS or ?filter=type in (CMF_STATUS, JOB_STATUS)
          Example (with severity): ?filter=severity=WARNING or ?filter=type=JOB_STATUS,severity=WARNING
          Example (with clusterStatus): ?filter=clusterStatus in (CONNECTED, DISCONNECTED)
          Example (with source): ?filter=state=COMPLETED,source=SCHEDULE
        explode: true
        in: query
        name: filter
        required: false
        schema:
          type: string
        style: form
      - description: |-
          Comma-separated list of field paths to include in the response. Supports nested fields using dot notation.
          Always includes apiVersion and kind fields even if not explicitly requested.
          Example: ?fields=metadata.name,metadata.createdTimestamp,status.phase
        explode: true
        in: query
        name: fields
        required: false
        schema:
