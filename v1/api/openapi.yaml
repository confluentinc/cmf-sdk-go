  /cmf/api/v1/c3/whoami:
    get:
      description: |-
        Returns the principal CMF authenticated the current request as -- the JWT/OIDC/Basic
        subject or, for mTLS, the client-certificate subject mapped to a principal. Lets the
        cmf-ui SPA label the signed-in user even when there is no token to decode (mTLS), where
        the principal exists only server-side. Requires authentication when authentication is
        enabled; when authentication is disabled the endpoint is still reachable and returns a
        null principal.
      operationId: getWhoami
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhoAmi'
            application/yaml:
              schema:
                $ref: '#/components/schemas/WhoAmi'
          description: Current principal returned successfully.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: Server error.
      summary: Return the authenticated principal's identity.
      tags:
      - C3
components:
  parameters:
    pageParam:
      description: Zero-based page index (0..N)
      explode: true
      in: query
      name: page
      required: false
      schema:
        type: integer
      style: form
    sizeParam:
      description: The size of the page to be returned
      explode: true
      in: query
      name: size
      required: false
      schema:
        type: integer
      style: form
    sortParam:
      description: |-
        Sorting criteria in the format: property,(asc|desc). Default sort order is ascending.
        Multiple sort criteria are supported.
      explode: true
      in: query
      name: sort
      required: false
      schema:
        items:
          type: string
        type: array
      style: form
    pageTokenParam:
      description: Token for the next page of results
      explode: true
      in: query
      name: page-token
      required: false
      schema:
        type: string
      style: form
    includeResourceInformationParam:
      description: Whether to include resource summary in the response.
      explode: true
      in: query
      name: include-resource-information
      required: false
      schema:
        default: false
        type: boolean
      style: form
    computePoolParam:
      description: Name of the ComputePool to filter on
      explode: true
      in: query
      name: compute-pool
      required: false
      schema:
        type: string
      style: form
    phaseParam:
      description: Phase to filter on
      explode: true
      in: query
      name: phase
      required: false
      schema:
        enum:
        - pending
        - running
        - completed
        - deleting
        - failing
        - failed
        - stopped
        type: string
      style: form
    filterParam:
      description: |-
        Filter query string with comma-separated expressions. Supports:
        - Name filtering: name=foo*bar (wildcards allowed)
        - Label equality: labels.key = value or labels.key != value
        - Label set-based: labels.key in (value1, value2) or labels.key notin (value1, value2)
        - Label existence: labels.key (exists) or !labels.key (does not exist)
        - State filtering (Applications only): state=RUNNING or state in (RUNNING, FAILED) or state notin (RUNNING, FAILED)
        - Phase filtering (Statements and ComputePools): phase=PENDING or phase in (PENDING, RUNNING) or phase notin (PENDING, RUNNING)
        - Type filtering (Events only): type=CMF_STATUS or type in (CMF_STATUS, JOB_STATUS) or type notin (CMF_STATUS, JOB_STATUS)
        - Cluster status filtering (Environments only): clusterStatus=CONNECTED or clusterStatus in (CONNECTED, DISCONNECTED) or clusterStatus notin (CONNECTED, DISCONNECTED). Values match the effective state of the backing Kubernetes cluster (CONNECTED, DISCONNECTED, DECOMMISSIONED).
        - Source filtering (Savepoints only): source=MANUAL or source in (MANUAL, SCHEDULE) or source notin (UPGRADE). Identifies how the savepoint was created. Values: MANUAL (triggered via API, CLI, or UI), UPGRADE (created during an application upgrade), SCHEDULE (created by a periodic savepoint schedule). An unrecognized source value is rejected with HTTP 400 (unlike state, which simply returns no matches for an unknown value).
        Example: ?filter=name=foo*bar,labels.environment in (production, qa),!labels.development
        Example (with state): ?filter=name=prod*,state in (RUNNING, FAILED)
        Example (with phase): ?filter=name=my-stmt*,phase in (PENDING, RUNNING)
        Example (with type): ?filter=type=CMF_STATUS or ?filter=type in (CMF_STATUS, JOB_STATUS)
        Example (with clusterStatus): ?filter=clusterStatus in (CONNECTED, DISCONNECTED)
        Example (with source): ?filter=state=COMPLETED,source=SCHEDULE
      explode: true
      in: query
      name: filter
      required: false
      schema:
        type: string
      style: form
    searchParam:
      description: |-
        Search term to match against fields specified in searchScope.
        Note: Both search and searchScope must be provided together. If only one is provided, the request will be rejected.
        Example: ?search=foo&searchScope=name,kubernetesNamespace
      explode: true
      in: query
      name: search
      required: false
      schema:
        type: string
      style: form
    searchScopeParam:
      description: |-
        Comma-separated list of fields to search in. Must be provided together with the search parameter.
        Unsupported field names will result in a 400 Bad Request.
        For Environments: supported fields are name, kubernetesNamespace.
        For Statements: supported fields are name, statement.
        For Events: supported fields are message, flinkApplicationInstance.
        For Secrets: supported fields are name, environments.
        For Kafka Catalogs: supported fields are name.
        When multiple fields are specified, the search uses OR logic.
        Example (Environments): ?search=foo&searchScope=name,kubernetesNamespace means (name contains foo OR kubernetesNamespace contains foo)
        Example (Statements): ?search=SELECT&searchScope=name,statement means (name contains SELECT OR statement contains SELECT)
        Example (Events): ?search=RUNNING&searchScope=message,flinkApplicationInstance means (message contains RUNNING OR flinkApplicationInstance equals RUNNING)
      explode: true
      in: query
      name: searchScope
      required: false
      schema:
        type: string
      style: form
    fieldsParam:
      description: |-
        Comma-separated list of field paths to include in the response. Supports nested fields using dot notation.
        Always includes apiVersion and kind fields even if not explicitly requested.
        Example: ?fields=metadata.name,metadata.createdTimestamp,status.phase
      explode: true
      in: query
      name: fields
      required: false
      schema:
        type: string
      style: form
  requestBodies:
    inline_object_1:
      content:
        multipart/form-data:
          schema:
            $ref: '#/components/schemas/inline_object_1'
      required: true
    inline_object:
      content:
        multipart/form-data:
          schema:
            $ref: '#/components/schemas/inline_object'
      required: true
  responses:
    InternalServerError:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RestError'
        application/yaml:
          schema:
            $ref: '#/components/schemas/RestError'
      description: Server error.
    BadRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RestError'
        application/yaml:
          schema:
            $ref: '#/components/schemas/RestError'
      description: Bad request.
    UnprocessableEntity:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RestError'
        application/yaml:
          schema:
            $ref: '#/components/schemas/RestError'
      description: Request valid but invalid content.
    NotModified:
      description: Not modified.
      headers:
        ETag:
          description: An ID for this version of the response.
          explode: false
          schema:
            type: string
          style: simple
  schemas:
    RestError:
      description: The schema for all error responses.
      properties:
        errors:
          description: List of all errors
          items:
            $ref: '#/components/schemas/error'
          title: errors
          type: array
      title: REST Error
      type: object
    PaginationResponse:
      properties:
        pageable:
          $ref: '#/components/schemas/Pageable'
      type: object
    Sort:
      format: sort
      properties:
        sorted:
          description: Whether the results are sorted.
          example: true
          type: boolean
        unsorted:
          description: Whether the results are unsorted.
          example: false
          type: boolean
        empty:
          type: boolean
      type: object
    Pageable:
      format: pageable
      properties:
        page:
          minimum: 0
          type: integer
        size:
          description: The number of items in a page.
          minimum: 1
          type: integer
        sort:
          $ref: '#/components/schemas/Sort'
      type: object
    ResourceBaseV2:
      properties:
        apiVersion:
          description: API version for spec
          type: string
        kind:
          description: Kind of resource - set to resource type
          type: string
      required:
      - apiVersion
      - kind
      type: object
    PostResourceBase:
      properties:
        name:
          deprecated: true
          description: A unique name for the resource.
          minLength: 4
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
          title: Name
          type: string
      type: object
    GetResourceBase:
      properties:
        created_time:
          format: date-time
          title: Time when the resource has been created
          type: string
        updated_time:
          format: date-time
          title: Time when the resource has been last updated
          type: string
      type: object
    KubernetesNamespace:
      properties:
        kubernetesNamespace:
          description: Immutable after creation. Cannot be changed via update.
          maxLength: 253
          minLength: 1
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
          title: Kubernetes namespace name where resources referencing this environment
            are created in.
          type: string
      type: object
    KubernetesClusterName:
      properties:
        kubernetesClusterName:
          description: Immutable after creation. Cannot be changed via update. Defaults
            to "default-k8s-cluster" if not provided on creation.
          maxLength: 253
          minLength: 1
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
          title: Name of the Kubernetes cluster where this environment's resources
            are deployed.
          type: string
      type: object
    ResourceWithFlinkApplicationDefaults:
      properties:
        flinkApplicationDefaults:
          description: |
            Environment-level defaults for FlinkApplication specs. The structure mirrors a
            FlinkApplication itself: place a "spec" object here whose fields are merged into
            every application spec at deploy time. May include a "savepointSchedule" inside
            "spec" (see SavepointScheduleConfig) to set the default periodic savepoint schedule
            for every application in the environment; env-level schedule fields take precedence
            over any value set on the resource itself.
          format: yamlorjson
          title: the defaults as YAML or JSON for FlinkApplications
          type: object
      type: object
    ComputePoolDefaults:
      properties:
        computePoolDefaults:
          description: the defaults as YAML or JSON for ComputePools
          format: yamlorjson
          title: ComputePoolDefaults
          type: object
      type: object
    StatementDefaults:
      properties:
        flinkConfiguration:
          additionalProperties:
            type: string
          description: default Flink configuration for Statements
          type: object
        savepointSchedule:
          $ref: '#/components/schemas/SavepointScheduleConfig'
      type: object
    AllStatementDefaults:
      properties:
        statementDefaults:
          $ref: '#/components/schemas/AllStatementDefaults_1'
      type: object
    SavepointScheduleConfig:
      description: Cron-based periodic savepoint trigger and retention configuration.
      properties:
        cronExpression:
          description: |
            Six-field cron expression with seconds resolution, in the order: second, minute, hour,
            day-of-month, month, day-of-week. Minimum interval between triggers is 5 minutes.
          type: string
        timezone:
          description: |
            IANA time zone ID used to evaluate the cron expression. When omitted, UTC is used.
            No schema-level default is declared on purpose: environment-level defaults are merged
            over resource-level settings field by field, so a materialized default here would
            silently override the resource's explicit value.
          type: string
        paused:
          description: |
            When true, the schedule is registered but no new savepoints are triggered. When
            omitted, the schedule is not paused.
          type: boolean
        catchUpOnRestart:
          description: |
            When true, if CMF restarts after missing at least one scheduled trigger, fire exactly
            one catch-up trigger immediately on startup. When omitted, no catch-up is performed.
          type: boolean
        jitterSeconds:
          description: |
            Upper bound (in seconds) for the random offset added to each trigger time. Null or 0
            means the service auto-computes a bound based on the cron interval; a positive value
            sets the bound explicitly.
          format: int32
          minimum: 0
          type: integer
        blackoutWindows:
          description: |
            Time ranges during which periodic savepoint triggers are suppressed. Missed triggers
            during blackouts are skipped, not retried.
          items:
            $ref: '#/components/schemas/BlackoutWindow'
          type: array
        freshnessThresholdHours:
          description: |
            Maximum acceptable gap in hours between successful periodic savepoints. CMF logs a
            SAVEPOINT_SLA_VIOLATION warning (visible in the CMF server log, not via the API) when
            the threshold is exceeded. When omitted or 0, the check is disabled.
          format: int32
          minimum: 0
          type: integer
        formatType:
          description: |
            Savepoint format (see the Flink savepoint documentation) used for every scheduled
            savepoint this schedule triggers. No schema-level default is declared on purpose:
            environment-level defaults are merged over resource-level settings field by field, so
            a materialized default here would silently override the resource's explicit value. A
            null value is treated as CANONICAL when the savepoint is triggered.
          enum:
          - CANONICAL
          - NATIVE
          - UNKNOWN
          type: string
        retention:
          $ref: '#/components/schemas/SavepointRetention'
      title: SavepointScheduleConfig
      type: object
    BlackoutWindow:
      description: A recurring time range during which scheduled savepoints are not
        triggered.
      properties:
        cronExpression:
          description: |
            Six-field cron expression with seconds resolution (second, minute, hour, day-of-month,
            month, day-of-week) whose firing times mark the START of each blackout window.
          type: string
        durationMinutes:
          default: 60
          description: Duration of the blackout in minutes starting from the cron
            fire time.
          format: int32
          minimum: 1
          type: integer
        timezone:
          description: |
            IANA time zone for evaluating this window's cron expression. Defaults to the parent
            schedule's timezone when omitted.
          type: string
      required:
      - cronExpression
      title: BlackoutWindow
      type: object
    SavepointScheduleStatus:
      description: Read-only runtime status for a savepoint schedule.
      properties:
        state:
          description: Lifecycle state of the schedule.
          enum:
          - ACTIVE
          - PAUSED
          - FKO_MANAGED
          - DISABLED
          readOnly: true
          type: string
        lastTriggerTime:
          description: |
            Time at which the trigger task last attempted to create a savepoint, i.e. the last fire
            that passed the blackout, resource-ready and in-flight guards. Skipped fires do not
            update this field, and it reflects the attempt regardless of whether the savepoint
            request succeeded. Use lastCompletedTime to know when a savepoint last completed.
          format: date-time
          readOnly: true
          type: string
        nextTriggerTime:
          description: Next time at which the schedule will be evaluated for a trigger.
          format: date-time
          readOnly: true
          type: string
        lastCompletedTime:
          description: |
            Time at which the most recent savepoint for this resource completed successfully,
            across all sources (scheduled, manual, or adopted), or null if none has completed yet.
            This is the freshness signal the schedule's SLA check is measured against.
          format: date-time
          readOnly: true
          type: string
        lastErrorMessage:
          description: Last failure observed by the trigger task, or null if healthy.
          readOnly: true
          type: string
      title: SavepointScheduleStatus
      type: object
    SavepointsBulkDeleteResult:
      description: Result body for the bulk delete savepoints endpoint.
      example:
        failedCount: 6
        failures:
        - reason: reason
          name: name
        - reason: reason
          name: name
        deletedCount: 0
      properties:
        deletedCount:
          description: Number of savepoints that were successfully deleted.
          format: int32
          type: integer
        failedCount:
          description: Number of savepoints that failed to delete.
          format: int32
          type: integer
        failures:
          description: Per-savepoint failure details for each savepoint that could
            not be deleted.
          items:
            $ref: '#/components/schemas/SavepointsBulkDeleteResult_failures'
          type: array
      title: SavepointsBulkDeleteResult
      type: object
    PostEnvironment:
      allOf:
      - $ref: '#/components/schemas/PostResourceBase'
      - $ref: '#/components/schemas/ResourceWithFlinkApplicationDefaults'
      - $ref: '#/components/schemas/KubernetesNamespace'
      - $ref: '#/components/schemas/KubernetesClusterName'
      - $ref: '#/components/schemas/ComputePoolDefaults'
      - $ref: '#/components/schemas/AllStatementDefaults'
      - $ref: '#/components/schemas/PostEnvironment_allOf'
      description: Environment
      title: Environment
      type: object
    Environment:
      allOf:
      - $ref: '#/components/schemas/PostResourceBase'
      - $ref: '#/components/schemas/GetResourceBase'
      - $ref: '#/components/schemas/ResourceWithFlinkApplicationDefaults'
      - $ref: '#/components/schemas/KubernetesNamespace'
      - $ref: '#/components/schemas/KubernetesClusterName'
      - $ref: '#/components/schemas/ComputePoolDefaults'
      - $ref: '#/components/schemas/AllStatementDefaults'
      - $ref: '#/components/schemas/PostEnvironment_allOf'
      description: Environment
      example:
        secrets:
