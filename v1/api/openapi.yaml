        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: Server error.
      summary: Creates a new Flink SQL Statement in the given Environment.
      tags:
      - SQL
  /cmf/api/v1/environments/{envName}/statements/{stmtName}:
    delete:
      description: 'For a statement on a dedicated compute pool, deletion completes
        immediately. For a statement on a shared compute pool, a successful response
        only means the deletion request was accepted: the statement remains readable,
        reporting phase `DELETING` and with `deletionRequestedTimestamp` set in its
        metadata, until the underlying Kubernetes resources have actually been removed.'
      operationId: deleteStatement
      parameters:
      - description: Name of the Environment
        explode: false
        in: path
        name: envName
        required: true
        schema:
          type: string
        style: simple
      - description: Name of the Statement
        explode: false
        in: path
        name: stmtName
        required: true
        schema:
          type: string
        style: simple
      - description: 'If set to `true`, the platform deletes the statement from CMF
          metadata even if its Kubernetes resources cannot be cleaned up, without
          requiring Kubernetes cluster connectivity. This takes priority over `skipCleanup`:
          when both are set, finalizers are not cleared and `skipCleanup` has no effect.'
        explode: true
        in: query
        name: force
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: If set to `true`, forcibly clears any finalizers blocking the
          deletion of the statement's underlying Kubernetes resources. Only use this
          if a statement on a shared compute pool has remained in a pending-deletion
          state for longer than expected. This skips any cleanup those finalizers
          would otherwise have performed, including cancelling the statement's Flink
          job on the shared compute pool, so the job may keep running after the statement
          is deleted. Only use it once you've confirmed the resource is genuinely
          stuck rather than still in the middle of a normal, in-progress cleanup.
          Has no effect on statements on dedicated compute pools, when `force` is
          also set, or if Kubernetes is not already deleting the statement's underlying
          FlinkSessionJob.
        explode: true
        in: query
        name: skipCleanup
        required: false
        schema:
          default: false
          type: boolean
        style: form
      responses:
        "204":
          description: Deletion request accepted.
        "202":
          description: Statement was found and deletion request received.
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: Statement not found.
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: CMF is restoring the resources it manages after a restart and
            cannot accept this request yet. Retry shortly. The message names the resource
            that was refused. Requests that do not change managed resources are unaffected.
            The progress of the restore is reported by the system information endpoint.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: Server error.
      summary: Requests deletion of the Statement of the given name in the given Environment.
      tags:
      - SQL
    get:
      operationId: getStatement
      parameters:
      - description: Name of the Environment
        explode: false
        in: path
        name: envName
        required: true
        schema:
          type: string
        style: simple
      - description: Name of the Statement
        explode: false
        in: path
        name: stmtName
        required: true
        schema:
          type: string
        style: simple
      - description: Whether to include resource summary in the response.
        explode: true
        in: query
        name: include-resource-information
        required: false
        schema:
          default: false
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Statement'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Statement'
          description: Statement found and returned.
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: Statement not found.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: Server error.
      summary: Retrieve the Statement of the given name in the given Environment.
      tags:
      - SQL
    put:
      operationId: updateStatement
      parameters:
      - description: Name of the Environment
        example: production
        explode: false
        in: path
        name: envName
        required: true
        schema:
          type: string
        style: simple
      - description: Name of the Statement
        explode: false
        in: path
        name: stmtName
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Statement'
          application/yaml:
            schema:
              $ref: '#/components/schemas/Statement'
        required: true
      responses:
        "200":
          description: Statement was found and updated.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: Bad request.
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: Statement not found.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: The Statement cannot be updated in its current state, for example
            because it would be deployed onto a compute pool that is not running,
            because the platform could not check whether the Statement's Flink resource
            exists on the Kubernetes cluster (retry the update; if it fails again,
            the CMF log has the cause), or because that resource was created or deleted
            while the update ran (retry the update). It is also returned when the
            update would start the Statement's job and the platform could not check
            the compiled plan on the Kubernetes cluster, could not read the stored
            copy it needs to restore that plan, found that copy missing from a plan
            store that holds no plans or, once the platform has recorded its identity
            marker .cmf-plan-store-id, does not hold that marker, or could not write
            the restored plan to the cluster, or when that plan changed while the
            update ran; the error says whether to retry the update, retry it later,
            or fix a cause it names first. When only deleting and recreating the Statement
            can help, which starts it without its state, as when artifact management
            (cmf.artifacts.enabled) is meant to be off, the error says so. It is also
            returned while its Environment is being deleted together with everything
            in it.
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: |-
            The update is not valid for this Statement, for example because:

            - it changes a field that cannot be changed;
            - it sets a startFromSavepoint that names no usable savepoint;
            - it would start a Statement whose Flink resource no longer exists (for example,
              after a disaster recovery) without the state it needs:
              - its upgradeMode is savepoint or last-state, and it has no savepoint to restore
                from or only ones older than cmf.recovery.max-restore-point-age: name a usable
                savepoint in startFromSavepoint, or set upgradeMode to stateless to start
                without state;
              - the savepoint named in startFromSavepoint can no longer be used: replace or
                remove that startFromSavepoint (stateless does not help);
              - it is an INSERT INTO or STATEMENT SET that runs in batch mode, and its job
                already ran: a batch job has no state to start from, so it would run again
                from the start and could write its output a second time. Create a new
                Statement to run it again;
            - it would start the Statement's job, and the Statement has no usable compiled
              plan: the plan on the Kubernetes cluster is missing or was changed, and no stored
              copy that matches the Statement exists to restore it from. If the error says the
              plan store may be a copy or replica that does not yet hold every plan, follow its
              advice. Otherwise, if it says cmf.artifacts.base-path may have changed since the
              plan was stored, first check that it still points where the plan was stored; if it
              does not, correct it, restart the platform and retry the update. Otherwise delete
              and recreate the Statement; the new Statement starts without the old one's state.
              The plans of interactive SELECT Statements are not stored: if the plan of one is
              missing, delete the Statement and submit it again.
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: The platform itself is not permitted to read the Statement's
            Flink resource on the Kubernetes cluster, which it checks before deploying
            the update, or Kubernetes denied it a read or write of the ConfigMap that
            holds the Statement's compiled plan, which it checks before an update
            starts the Statement's job. Besides a missing permission, a resource quota
            or an admission webhook can deny a ConfigMap write, and a namespace being
            deleted can deny creating the ConfigMap. The error names the permission
            to grant if the platform lacks it; the CMF log has the reason Kubernetes
            returned.
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: CMF is restoring the resources it manages after a restart and
            cannot accept this request yet. Retry shortly. The message names the resource
            that was refused. Requests that do not change managed resources are unaffected.
            The progress of the restore is reported by the system information endpoint.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: Server error.
      summary: Updates a Statement of the given name in the given Environment.
      tags:
      - SQL
