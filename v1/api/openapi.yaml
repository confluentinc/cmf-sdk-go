    C3Features:
      description: |-
        Which optional CMF UI features the deployment exposes, advertised to the cmf-ui SPA so it
        can adapt its UI before calling a feature's endpoints. Each flag reflects a
        deployment-wide configuration switch, not the caller's permissions.
      example:
        metadata:
          name: features
        apiVersion: apiVersion
        kind: kind
        status:
          roleBindingEnabled: true
          sqlAssistant:
            inputTokenLimit: 0
            maxResultRows: 6
            aiEnabled: true
            model: model
            enabled: true
          podLogsEnabled: true
      properties:
        apiVersion:
          title: API version for the features - set to cmf.confluent.io/v1
          type: string
