          type: string
        style: simple
      - description: If set to `true`, the platform deletes the compute pool from
          CMF metadata only, without requiring Kubernetes cluster connectivity. For
          shared compute pools, the underlying session cluster's Kubernetes resources
          might be orphaned. This configuration has no additional effect on dedicated
          compute pools that are always metadata-only.
        explode: true
        in: query
        name: force
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: If set to `true`, forcibly clears any finalizers blocking the
          deletion of the underlying session cluster's Kubernetes resources. Only
          use this if a shared compute pool has remained in a pending-deletion state
          for longer than expected. This skips any cleanup those finalizers would
          otherwise have performed, so it should only be used once you've confirmed
          the resource is genuinely stuck rather than still in the middle of a normal,
          in-progress cleanup. Has no effect on dedicated compute pools.
        explode: true
        in: query
        name: skipCleanup
        required: false
        schema:
          default: false
          type: boolean
        style: form
      responses:
        "204":
          description: Deletion request accepted.
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
