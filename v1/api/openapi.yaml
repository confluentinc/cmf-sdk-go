    StatementMetadata:
      description: Metadata about the statement
      properties:
        name:
          description: Name of the Statement
          type: string
        creationTimestamp:
          description: Timestamp when the Statement was created
          type: string
        updateTimestamp:
          description: Timestamp when the Statement was updated last
          type: string
        deletionRequestedTimestamp:
          description: Timestamp when deletion of this Statement was requested. Only
            present while a shared statement's underlying Kubernetes resources are
            being deleted; absent if no deletion has been requested.
          type: string
        uid:
          description: Unique identifier of the Statement
          type: string
        labels:
          additionalProperties:
            type: string
          description: Labels of the Statement
          type: object
        annotations:
          additionalProperties:
            type: string
          description: Annotations of the Statement
          type: object
      required:
      - name
      title: StatementMetadata
      type: object
    StatementSpec:
      description: Spec for statement
      properties:
        statement:
          description: SQL statement. In CREATE MODEL and ALTER MODEL statements,
            option values are stored and returned masked as SHOW CREATE MODEL shows
            them, for example 'api-key' = '******'.
          type: string
        properties:
          additionalProperties:
            type: string
          description: Properties of the client session
          title: SessionProperties
          type: object
        flinkConfiguration:
          additionalProperties:
            type: string
          description: |
            Flink configuration for the statement.

            Some keys are reserved and cannot be set: `web.submit.jar-sources`,
            `pipeline.jars`, `pipeline.classpaths`, and every key beginning with
            `user.artifacts.` or `kubernetes.operator.cmf.`. A statement that sets one is
            rejected with an error naming the key.
          title: StatementFlinkConfiguration
          type: object
        computePoolName:
          description: Name of the ComputePool
          type: string
        parallelism:
          description: Parallelism of the statement
          format: int32
          type: integer
        stopped:
          description: |
            Whether the statement is stopped.

            A Flink job that runs in batch mode cannot resume, so an `INSERT INTO` or
            `STATEMENT SET` statement that runs in batch mode cannot be resumed once its
            job has run, and an update that would restart its running job, such as a
            change of `parallelism`, is rejected. Either would run the job again from the
            start and could write its output a second time. A change to the
            environment's or compute pool's defaults since the job started also
            restarts it, so then even an update of only `labels` is rejected. A
            statement created with `stopped: true` can be resumed once. Create a new
            statement to run the query again.
          type: boolean
        startFromSavepoint:
          $ref: '#/components/schemas/StatementStartFromSavepoint'
        savepointSchedule:
          $ref: '#/components/schemas/SavepointScheduleConfig'
        upgradeMode:
          description: |
            Controls whether the statement's execution state is preserved across a
            stop and resume, or when the statement's job has to be resubmitted (for
            example, after the compute pool loses track of a running job and has to
            recreate it).

            This is separate from Flink's own recovery from task failures while the
            job keeps running: that recovery is governed by the job's checkpointing
            and restart-strategy settings and happens regardless of this field.

            * `savepoint`: CMF takes a savepoint when the statement is stopped or
              resubmitted, and restores from it on resume. Requires both
              `state.checkpoints.dir` and `state.savepoints.dir` to be configured on
              the compute pool the statement runs on (directly or via the
              environment's `computePoolDefaults`); setting these directories on the
              statement itself has no effect on this field.
            * `stateless`: no state is preserved across a stop and resume, or a
              resubmission. The statement comes back up with empty state even if a
              checkpoint or savepoint is available.
            * `last-state`: on resubmission, the statement resumes from its most
              recent checkpoint without CMF taking a new savepoint. Requires
              `state.checkpoints.dir` to be configured on the compute pool the
              statement runs on (directly or via the environment's
              `computePoolDefaults`). Not supported for statements that run on a
              shared compute pool.

            Optional. When omitted, CMF selects `savepoint` if both a checkpoint
            directory and a savepoint directory are configured on the compute pool,
            and `stateless` otherwise.

            A stopped SELECT, and a stopped statement that runs in batch mode
            (`execution.runtime-mode: BATCH`), use `stateless` whatever this field is
            set to, so that the stop cancels the job. Flink cannot take a savepoint of
            a batch job.

            Changing this field alone does not restart a running statement. The new
            value takes effect on the next stop and resume, or the next time the
            statement's job is resubmitted.
          enum:
          - stateless
          - savepoint
          - last-state
          type: string
      required:
      - computePoolName
      - statement
      title: StatementSpec
      type: object
    StatementTraits:
      description: Detailed information about the properties of the statement
      properties:
        sqlKind:
          description: The kind of SQL statement
          type: string
        isBounded:
          description: Whether the result of the statement is bounded
          type: boolean
        isAppendOnly:
          description: Whether the result of the statement is append only
          type: boolean
        upsertColumns:
          description: The column indexes that are updated by the statement
          items:
            format: int32
            type: integer
          type: array
        schema:
          $ref: '#/components/schemas/ResultSchema'
        udfJarUris:
          description: |-
            UDF JAR URIs (pre-resolution, e.g. `cmf://`, `s3://`) that this
            statement references via the environment catalog. Empty or absent
            when the statement uses no env-catalog UDFs. Surfaced so callers
            can see which JARs the statement loads at runtime.
          items:
            type: string
          type: array
        connectorJarUris:
          description: |-
            Connector and format artifact JAR URIs (e.g. `s3://`) that this
            statement's referenced tables require, one entry per connector or
            format actually used, and the JAR URI (e.g. `file://`) of the provider
            of each model the statement calls, for providers that ship as a separate
            JAR. Empty or absent when the statement needs none of these JARs. Surfaced
            so callers can see which JARs the statement loads at runtime.
          items:
            type: string
          type: array
        inheritedOffsetTopics:
          description: |-
            Topics whose Kafka sources this statement starts from the offsets it
            inherited through `sql.tables.initial-offset-from`. Empty when it
            inherits offsets but every source sets its own start, for example with a
            `scan.startup.mode` OPTIONS hint. Absent when it inherits no offsets or
            still waits for them, and when CMF cannot tell which topics its sources
            start from, for example for a statement started by an earlier CMF
            version; recovery then treats a statement that inherits offsets as
            starting its Kafka sources from them.
          items:
            type: string
          nullable: true
          readOnly: true
          type: array
          x-field-extra-annotation: '@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)'
        upgradeMode:
          description: |-
            The upgrade mode that has been applied to the statement's deployment,
            shown so callers can see the value that took effect without inspecting
            the underlying Flink resources. When `spec.upgradeMode` is set, this
            matches it, except on a stopped SELECT or a stopped batch statement,
            which use `stateless`; otherwise it is the value selected by the default
            rules described on
            `spec.upgradeMode`. Populated once the statement has been
            deployed at least once; absent before the first deployment attempt.
          enum:
          - stateless
          - savepoint
          - last-state
          type: string
        jobId:
          description: |-
            The ID of the Flink job most recently submitted for this statement.
            Absent for interactive SELECT statements, and until the statement's first
            job is submitted.

            Use it to identify the job's checkpoints, stored under
            `<state.checkpoints.dir>/<jobId>/`, for example to restore the statement
            from its latest checkpoint after a disaster. A newly submitted job may not
            have completed a checkpoint yet.

            The ID is kept while the statement is stopped. It changes when the
            statement is resumed or redeployed with any upgrade mode other than
            `last-state`.
          readOnly: true
          type: string
        parkedByRecovery:
          description: |-
            Set when CMF, recreating the statement's missing Flink resources after
            a restart, stopped the statement instead of starting it without the state
            it needs, or instead of letting it reprocess input. `status.detail` says
            how to recover it. Cleared when the statement is resumed, or set to FAILED
            because its compute pool was deleted. Values:
            `no-restore-point`: the statement has no savepoint to restore from;
            `restore-point-too-old`: the restore point CMF would use is older than
            `cmf.recovery.max-restore-point-age`;
            `start-from-savepoint-unresolved`: the savepoint set in
            `spec.startFromSavepoint` no longer resolves;
            `carry-over-replay`: the statement starts Kafka sources from the offsets
            it inherited from another statement
            (`sql.tables.initial-offset-from`, see `inheritedOffsetTopics`) and it has
            no savepoint CMF can restore it from (none exists, the
            `startFromSavepoint` it last started from no longer resolves, or each one
            is older than `cmf.recovery.max-restore-point-age` or was taken before
            that `startFromSavepoint` was applied), so starting it would reprocess
            all their input since the offsets it was created with. Resuming the
            statement starts it anyway;
            `batch-rerun`: the statement is an `INSERT INTO` or `STATEMENT SET` that
            runs in batch mode and its job already ran. A batch job cannot resume, so
            starting it again would run it from the start and could write its output
            a second time. The statement cannot be resumed; create a new statement to
            run it again.
          enum:
          - no-restore-point
          - restore-point-too-old
          - start-from-savepoint-unresolved
          - carry-over-replay
          - batch-rerun
          readOnly: true
          type: string
        runtimeMode:
          description: |-
            The runtime mode the statement's Flink job runs in: `execution.runtime-mode`
            from the statement's `flinkConfiguration` merged with the Environment's
            statement defaults (statementDefaults.interactive for a SELECT,
            statementDefaults.detached for an INSERT INTO or a statement set), with
            the defaults' value taking precedence. STREAMING when neither sets it.
            Set when the statement is created and does not change.
            Absent for statements that do not run a Flink job (for example SHOW,
            DESCRIBE or CREATE TABLE), for statements that failed to compile, and for
            statements created by an earlier CMF version.
          enum:
          - STREAMING
          - BATCH
          readOnly: true
          type: string
          x-field-extra-annotation: '@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)'
      title: StatementTraits
      type: object
    StatementStatus:
      description: Status for statement
      properties:
        phase:
          description: 'The lifecycle phase of the statement. `PENDING`: the statement
            has been submitted, resumed or changed, and is waiting to start executing.
            `RECONCILING`: the statement''s job is being restored, cannot be found,
            or its state cannot be read, for example after its JobManager restarted
            or when the statement is redeployed from a savepoint. `RESTARTING`: the
            statement is restarting. `RUNNING`: the statement is executing. `COMPLETED`:
            the statement finished executing successfully. `DELETING`: the statement
            is being deleted. `FAILING`: the statement has failed and cleanup is in
            progress. `FAILED`: the statement has failed. `STOPPED`: the statement
            has been stopped. `UNKNOWN`: the statement''s phase could not be determined.'
          enum:
          - PENDING
          - RECONCILING
          - RESTARTING
          - RUNNING
          - COMPLETED
          - DELETING
          - FAILING
          - FAILED
          - STOPPED
          - UNKNOWN
          type: string
        detail:
          description: Details about the execution status of the statement
          type: string
        traits:
          $ref: '#/components/schemas/StatementTraits'
        resourceSummary:
          $ref: '#/components/schemas/ResourceUsageSummary'
        warning:
          description: |-
            Warning message indicating the displayed status may be stale,
            for example, when the backing Kubernetes cluster is disconnected or decommissioned.
          type: string
        savepointSchedule:
          $ref: '#/components/schemas/SavepointScheduleStatus'
        latestOffsets:
          additionalProperties:
            type: string
          description: |-
            The Kafka read positions this statement had reached, as a map of topic name
            to an offset string in the same format as the
            `scan.startup.specific-offsets` table option, for example
            `partition:0,offset:100;partition:1,offset:200`.

            Not populated when the statement stops. The positions are read from the
            savepoint taken when the statement was last stopped, and only once another
            statement names this one in its `sql.tables.initial-offset-from` property;
            absent until then, even when that savepoint has completed. After the statement
            runs and is stopped again, absent until the newer savepoint is read the same
            way.

            Only topics the statement read appear. A partition it had not read from yet
            appears as `offset:-2` when it was to start from the earliest offset; one that
            was to start from the latest or the committed offset is left out, and a topic
            whose partitions are all left out does not appear. A statement inheriting
            these offsets starts a partition left out of a listed topic from its
            committed group offset if there is one, otherwise from the earliest offset.

            Available only while carry-over offsets is enabled
            (`cmf.sql.carry-over-offsets.enabled`), for detached statements reading Kafka
            tables, and when the statement's compute pool is configured to take a
            savepoint when a statement is stopped. Absent otherwise.
          title: StatementLatestOffsets
          type: object
        latestOffsetsTimestamp:
          description: |-
            When `latestOffsets` was read from the savepoint. Absent while
            `latestOffsets` is absent.
          format: date-time
          type: string
      required:
      - phase
      title: StatementStatus
      type: object
