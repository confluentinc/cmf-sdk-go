                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: |-
            A resource with the same name already exists and would conflict with this Statement.
            This can happen if an Application, Statement, Savepoint, or shared Compute Pool with
            the same name already exists in this Environment, or in another Environment that maps
            to the same Kubernetes namespace and cluster. It can also happen if a Flink resource
            with the same name already exists in the namespace independently of this Statement
            (for example, created outside of CMF, or left over from a previous resource with the
            same name that was not fully cleaned up).
