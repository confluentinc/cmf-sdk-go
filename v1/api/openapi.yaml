    SqlAssistantConversation:
      description: 'A SQL Assistant conversation, scoped to an environment. Conversations
        have no owner: everyone who can use the SQL Assistant in the environment shares
        them. Reading conversations and their turns requires the View permission on
        the FlinkStatement named `sql-assistant-` in the environment. Creating, updating
        and deleting conversations, and adding turns, requires the Edit permission
        on it. A role binding on all statements in the environment grants these, and
        so does a prefixed role binding on `sql-assistant-` or a shorter prefix of
        it.'
      example:
        metadata:
          uid: uid
          name: name
          creationTimestamp: 2000-01-23T04:56:07.000+00:00
          annotations:
            key: annotations
          updateTimestamp: 2000-01-23T04:56:07.000+00:00
          labels:
            key: labels
        apiVersion: apiVersion
        kind: kind
        spec:
          computePool: computePool
          title: title
        status:
          turnCount: 0
          lastMode: lastMode
          title: title
      properties:
        apiVersion:
          title: API version - set to cmf.confluent.io/v1alpha1
          type: string
        kind:
          title: Kind of resource - set to SqlAssistantConversation
          type: string
        metadata:
          $ref: '#/components/schemas/SqlAssistantConversationMetadata'
        spec:
          $ref: '#/components/schemas/SqlAssistantConversationSpec'
        status:
