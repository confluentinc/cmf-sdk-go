        - scope
        - scope
        descriptionHtml: descriptionHtml
        type: type
        category: category
        key: table.exec.mini-batch.enabled
      properties:
        key:
          description: The configuration key. A part in angle brackets, such as <name>,
            stands for a part of the key that the user chooses.
          example: table.exec.mini-batch.enabled
          type: string
        type:
          description: The type of the value as Flink's documentation names it, for
            example Boolean, Duration, Enum or Map.
          type: string
        defaultValue:
          description: The default value as Flink's documentation shows it, for example
            (none) or 1 s.
          type: string
