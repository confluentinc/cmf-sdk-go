        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: Server error.
      summary: Update an Artifact's labels and annotations, and/or upload a new version.
      tags:
      - Artifacts
