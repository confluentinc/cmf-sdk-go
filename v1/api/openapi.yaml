    KafkaDatabaseSpec_kafkaCluster:
      description: Details about the Kafka cluster of the database
      properties:
        connectionConfig:
          additionalProperties:
            type: string
          description: connection options for the Kafka client
          type: object
        connectionSecretId:
          description: an identifier to look up a secret that contains the connection
            credentials
          type: string
      required:
      - connectionConfig
      type: object
    KafkaDatabaseSpec:
      description: Spec of a Kafka Database
      properties:
        kafkaCluster:
          $ref: '#/components/schemas/KafkaDatabaseSpec_kafkaCluster'
        ddlEnvironments:
          description: List of environments that have permission to execute DDL statements
            on the tables of this database
          items:
            type: string
          type: array
        subjectNameStrategy:
          description: |
            How the tables of this database find their Schema Registry subjects. TopicNameStrategy, the default, uses the <topic>-key and <topic>-value subjects. AssociatedNameStrategy uses the topic-subject associations of the Kafka cluster: CREATE TABLE has the brokers register the schemas, and tables read the subjects their topic is associated with.

            AssociatedNameStrategy needs Schema Registry 8.3.1 or later, Kafka brokers with topic-subject associations enabled, and Flink 2.x. CMF accepts AssociatedNameStrategy only when it has a Flink 2.x SQL compiler (the default compilers include one). Statements on Flink 1.x compute pools fail when they use the tables of such a database, whether they name the database or run in it. A statement that sets a catalog but no database runs in the catalog's earliest-created database that its environment can connect to.

            If an update leaves out this field, the database keeps its current strategy. Keep the strategy once the database has tables, since it decides where those tables find their schemas.
          enum:
          - TopicNameStrategy
          - AssociatedNameStrategy
          type: string
      required:
      - kafkaCluster
      title: KafkaDatabaseSpec
      type: object
    KafkaDatabaseStatus:
      description: Status for Kafka Database
      properties:
        environmentsWithAccess:
          description: Environments with access to the Kafka Database
          items:
            type: string
          type: array
      title: KafkaDatabaseStatus
      type: object
    KafkaDatabase_allOf:
