        the savepoint remains readable, reported with `state` `DELETING`, until its
        underlying Kubernetes resources have actually been removed -- at which point
        it stops being returned by this API. With `force=true`, the savepoint is removed
        from CMF immediately without waiting for Kubernetes to confirm removal of
        the underlying resources. Unless `force` is set, a savepoint that is still
        being taken isn't deleted, and the request fails with 409 until it has completed.
