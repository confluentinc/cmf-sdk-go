            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: Server error.
      summary: List the service accounts on the grandfathered allowlist.
      tags:
      - ServiceAccountAllowlist
      x-spring-paginated: true
