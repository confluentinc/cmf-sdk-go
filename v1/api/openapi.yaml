        when no model was called.
      example:
        metadata:
          name: name
          creationTimestamp: 2000-01-23T04:56:07.000+00:00
        apiVersion: apiVersion
        kind: kind
        spec:
          schema:
          - schema
          - schema
          statementName: statementName
          role: user
          parallelism: 0
          rows:
          - - ""
            - ""
          - - ""
            - ""
          error: error
          sql: sql
          requestFix: true
          forTurn: forTurn
          selectedOptions:
          - selectedOptions
          - selectedOptions
          text: text
          flinkConfiguration:
            key: flinkConfiguration
          properties:
            key: properties
        status:
          textPosition: before
