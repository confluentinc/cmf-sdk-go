    AutoscalerMetadata:
      example:
        updateTimestamp: 2000-01-23T04:56:07.000+00:00
      properties:
        updateTimestamp:
          description: |
            Timestamp at which this state was read from the running Application. The autoscaler keeps updating its state afterwards, so a later read can report something different.
          format: date-time
          type: string
      title: AutoscalerMetadata
      type: object
    AutoscalerStatus:
      description: |
        What the autoscaler has observed and decided, and the options it is observing under. This resource is read only: everything here is an observation, and the options are changed by updating the Application or the Environment they come from.
      example:
        scalingEvents:
        - vertexId: vertexId
          fromParallelism: 5
          toParallelism: 5
          evaluatedMetrics:
            TRUE_PROCESSING_RATE: 27410.0
            TARGET_DATA_RATE: 27930.0
            SCALE_UP_RATE_THRESHOLD: 24180.0
          timestamp: 2000-01-23T04:56:07.000+00:00
        - vertexId: vertexId
          fromParallelism: 5
          toParallelism: 5
          evaluatedMetrics:
            TRUE_PROCESSING_RATE: 27410.0
            TARGET_DATA_RATE: 27930.0
            SCALE_UP_RATE_THRESHOLD: 24180.0
          timestamp: 2000-01-23T04:56:07.000+00:00
        parallelismOverrides:
          key: parallelismOverrides
        jobRunningSince: 2000-01-23T04:56:07.000+00:00
        metricHistory:
        - vertices:
            key:
              key: 6.027456183070403
          global:
            key: 1.4658129805029452
          timestamp: 2000-01-23T04:56:07.000+00:00
        - vertices:
            key:
              key: 6.027456183070403
          global:
            key: 1.4658129805029452
          timestamp: 2000-01-23T04:56:07.000+00:00
        options:
          key: options
        scalingTracking:
          key: '{}'
        scalingEnabled: true
        delayedScaleDown:
          vertices:
            key:
              firstTriggerTime: 2000-01-23T04:56:07.000+00:00
              recommendations:
              - parallelism: 0
                outsideUtilizationBound: true
                triggerTime: 2000-01-23T04:56:07.000+00:00
              - parallelism: 0
                outsideUtilizationBound: true
                triggerTime: 2000-01-23T04:56:07.000+00:00
        state: EVALUATING
        windowFullAt: 2000-01-23T04:56:07.000+00:00
        message: message
        enabled: true
      properties:
        enabled:
          description: Whether the autoscaler is turned on for this Application
          type: boolean
        scalingEnabled:
          description: |
            Whether the autoscaler may act on its recommendations. When false, the autoscaler still evaluates metrics and reports a recommended parallelism but never rescales the job.
          type: boolean
        options:
          additionalProperties:
            type: string
          description: |
            The autoscaler options the operator sees for this Application, as a map of option name to value (for example `job.autoscaler.utilization.target`). These are the Application's own options merged with the Application defaults of its Environment, so an option inherited from the Environment appears here too and cannot be told apart from one set on the Application. Options absent from this map fall back to the defaults of the Flink Kubernetes Operator in use.
          type: object
        state:
          description: |
            `EVALUATING` - a full metric window has been collected and the reported recommendations are current. `COLLECTING` - the autoscaler is still filling its metric window, so no recommendation exists yet. `DISABLED` - the autoscaler is not turned on for this Application. `UNAVAILABLE` - the state could not be read; see `message`. The boundary between `COLLECTING` and `EVALUATING` is `windowFullAt` and carries the same approximation.
          enum:
          - EVALUATING
          - COLLECTING
          - DISABLED
          - UNAVAILABLE
          title: AutoscalerState
          type: string
        message:
          description: Human readable explanation, set when the state is not EVALUATING
          type: string
        parallelismOverrides:
          additionalProperties:
            type: string
          description: |
            The parallelism the autoscaler is currently applying, as a map of job vertex id to parallelism. Empty when the autoscaler has not changed the job's parallelism.
          type: object
        delayedScaleDown:
          $ref: '#/components/schemas/AutoscalerDelayedScaleDown'
        metricHistory:
          default: []
          description: The metric samples currently in the autoscaler's window, oldest
            first
          items:
            $ref: '#/components/schemas/AutoscalerMetricSample'
          type: array
        jobRunningSince:
          description: |
            When the job started, as the operator reports it. The autoscaler's evaluation cycle is measured from the moment the job entered the RUNNING state, which is not reported here and is later than this by however long the job took to initialize, so treat this as the start of the cycle rather than its exact beginning. It also does not move where a rescale restarts the job in place, though the autoscaler's cycle does. Absent while the operator has reported no start time for the job.
          format: date-time
          type: string
        windowFullAt:
          description: |
            Approximately when the autoscaler first holds, or first held, a full metric window and so begins deciding: `jobRunningSince` plus the stabilization interval plus the metric window. Approximate in both directions - the autoscaler measures the window from its first sample after stabilization ends rather than from that instant, which puts the real moment later, while `jobRunningSince` is earlier than the state transition the autoscaler measures from, which puts it earlier. Absent while there is nothing to derive it from.
          format: date-time
          type: string
        scalingEvents:
          default: []
          description: |
            The parallelism changes the autoscaler has made, oldest first, flattened across job vertices.
          items:
            $ref: '#/components/schemas/AutoscalerScalingEvent'
          type: array
        scalingTracking:
          additionalProperties: true
          description: |
            Timing of recent rescale operations. The shape of each entry mirrors the autoscaler's own bookkeeping and may change between releases.
          type: object
      title: AutoscalerStatus
      type: object
