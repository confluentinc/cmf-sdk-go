    C3SqlAssistantFeature:
      description: |-
        SQL Assistant. When enabled is true its tab and endpoints are
        served. When aiEnabled is true a model is configured and the tab offers the
        natural-language chat; when false the tab is a manual SQL shell. model and
        inputTokenLimit describe the configured model and are absent when no model is
        configured.
