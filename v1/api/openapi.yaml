openapi: 3.0.1
info:
  description: Apache Flink job lifecycle management component for Confluent Platform.
  title: Confluent Manager for Apache Flink / CMF
  version: "1.0"
servers:
- url: http://localhost:8080
tags:
- description: |-
    Endpoints backing the CMF UI and the Confluent Control Center integration
    (license, effective configuration, auth discovery, current principal,
    feature flags, Flink configuration reference).
  name: C3
- name: Environments
- name: FlinkApplications
- name: Artifacts
- name: Secrets
- name: SQL
- name: Savepoints
- name: KubernetesClusters
- name: ServiceAccountAllowlist
paths:
  /cmf/api/v1/environments:
    get:
      operationId: getEnvironments
      parameters:
      - description: Zero-based page index (0..N)
        explode: true
        in: query
        name: page
        required: false
        schema:
          type: integer
        style: form
      - description: The size of the page to be returned
        explode: true
        in: query
        name: size
        required: false
        schema:
          type: integer
        style: form
      - description: |-
          Sorting criteria in the format: property,(asc|desc). Default sort order is ascending.
          Multiple sort criteria are supported.
        explode: true
        in: query
        name: sort
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      - description: Whether to include resource summary in the response.
        explode: true
        in: query
        name: include-resource-information
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: |-
          Filter query string with comma-separated expressions. Supports:
          - Name filtering: name=foo*bar (wildcards allowed)
          - Label equality: labels.key = value or labels.key != value
          - Label set-based: labels.key in (value1, value2) or labels.key notin (value1, value2)
          - Label existence: labels.key (exists) or !labels.key (does not exist)
          - State filtering (Applications only): state=RUNNING or state in (RUNNING, FAILED) or state notin (RUNNING, FAILED)
          - Status error filtering (Applications only): status.error (the Application's status reports an error, i.e. status.error is set and not blank) or !status.error (it reports none). An Application can report an error while its state is not FAILED, for example while its job keeps restarting.
          - Phase filtering (Statements and ComputePools): phase=PENDING or phase in (PENDING, RUNNING) or phase notin (PENDING, RUNNING)
          - Type filtering (Events only): type=CMF_STATUS or type in (CMF_STATUS, JOB_STATUS) or type notin (CMF_STATUS, JOB_STATUS)
          - Severity filtering (Events only): severity=WARNING or severity in (INFO, WARNING) or severity notin (WARNING). Values: INFO, WARNING. Severity is independent of type, so the two can be combined to narrow further (e.g. type=JOB_STATUS,severity=WARNING). An unrecognized severity value is rejected with HTTP 400.
          - Cluster status filtering (Environments only): clusterStatus=CONNECTED or clusterStatus in (CONNECTED, DISCONNECTED) or clusterStatus notin (CONNECTED, DISCONNECTED). Values match the effective state of the backing Kubernetes cluster (CONNECTED, DISCONNECTED, DECOMMISSIONED).
          - Source filtering (Savepoints only): source=MANUAL or source in (MANUAL, SCHEDULE) or source notin (UPGRADE). Identifies how the savepoint was created. Values: MANUAL (triggered via API, CLI, or UI), UPGRADE (created during an application upgrade), SCHEDULE (created by a periodic savepoint schedule). An unrecognized source value is rejected with HTTP 400 (unlike state, which simply returns no matches for an unknown value).
          Example: ?filter=name=foo*bar,labels.environment in (production, qa),!labels.development
          Example (with state): ?filter=name=prod*,state in (RUNNING, FAILED)
          Example (with status.error): ?filter=status.error,labels.team=payments
          Example (with phase): ?filter=name=my-stmt*,phase in (PENDING, RUNNING)
          Example (with type): ?filter=type=CMF_STATUS or ?filter=type in (CMF_STATUS, JOB_STATUS)
          Example (with severity): ?filter=severity=WARNING or ?filter=type=JOB_STATUS,severity=WARNING
          Example (with clusterStatus): ?filter=clusterStatus in (CONNECTED, DISCONNECTED)
          Example (with source): ?filter=state=COMPLETED,source=SCHEDULE
        explode: true
        in: query
        name: filter
        required: false
        schema:
          type: string
        style: form
      - description: |-
          Search term to match against fields specified in searchScope.
          Note: Both search and searchScope must be provided together. If only one is provided, the request will be rejected.
          Example: ?search=foo&searchScope=name,kubernetesNamespace
        explode: true
        in: query
        name: search
        required: false
        schema:
          type: string
        style: form
      - description: |-
          Comma-separated list of fields to search in. Must be provided together with the search parameter.
          Unsupported field names will result in a 400 Bad Request.
          For Environments: supported fields are name, kubernetesNamespace.
          For Statements: supported fields are name, statement.
          For Events: supported fields are message; application events also support flinkApplicationInstance.
          For Secrets: supported fields are name, environments.
          For Kafka Catalogs: supported fields are name.
          When multiple fields are specified, the search uses OR logic.
          Example (Environments): ?search=foo&searchScope=name,kubernetesNamespace means (name contains foo OR kubernetesNamespace contains foo)
          Example (Statements): ?search=SELECT&searchScope=name,statement means (name contains SELECT OR statement contains SELECT)
          Example (Application events): ?search=RUNNING&searchScope=message,flinkApplicationInstance means (message contains RUNNING OR flinkApplicationInstance equals RUNNING)
        explode: true
        in: query
        name: searchScope
        required: false
        schema:
          type: string
        style: form
      - description: |-
          Comma-separated list of field paths to include in the response. Supports nested fields using dot notation.
          Always includes apiVersion and kind fields even if not explicitly requested.
          Example: ?fields=metadata.name,metadata.createdTimestamp,status.phase
        explode: true
        in: query
        name: fields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentsPage'
            application/yaml:
              schema:
                $ref: '#/components/schemas/EnvironmentsPage'
          description: List of environments found. If no environments are found, an
            empty list is returned. Note the information about secret is not included
            in the list call yet. In order to get the information about secret, make
            a getSecret call.
        "304":
          description: Not modified.
          headers:
            ETag:
              description: An ID for this version of the response.
              explode: false
              schema:
                type: string
              style: simple
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: Server error.
      summary: Retrieve a paginated list of all environments.
      tags:
      - Environments
      x-spring-paginated: true
    post:
      operationId: createOrUpdateEnvironment
      requestBody:
        content:
          application/json:
            examples:
              basic-environment:
                summary: Basic Environment
                value:
                  name: production
                  kubernetesNamespace: flink-production
                  flinkApplicationDefaults:
                    spec:
                      flinkConfiguration:
                        taskmanager.numberOfTaskSlots: "4"
                        rest.profiling.enabled: "true"
                      jobManager:
                        resource:
                          memory: 1024m
                          cpu: 1
                      taskManager:
                        resource:
                          memory: 1024m
                          cpu: 1
                  computePoolDefaults:
                    clusterSpec:
                      flinkVersion: v1_19
                      image: confluentinc/cp-flink-sql:1.19-cmf2.5-cp1
                      flinkConfiguration:
                        taskmanager.numberOfTaskSlots: "4"
                  statementDefaults:
                    detached:
                      flinkConfiguration:
                        state.backend.type: hashmap
                    interactive:
                      flinkConfiguration:
                        state.backend.type: hashmap
            schema:
              $ref: '#/components/schemas/PostEnvironment'
          application/yaml:
            examples:
              basic-environment-yaml:
                summary: Basic Environment (YAML)
                value:
                  name: staging
                  kubernetesNamespace: flink-staging
                  flinkApplicationDefaults:
                    spec:
                      flinkConfiguration:
                        taskmanager.numberOfTaskSlots: "2"
                        rest.profiling.enabled: "true"
                      jobManager:
                        resource:
                          memory: 1024m
                          cpu: 1
                      taskManager:
                        resource:
                          memory: 1024m
                          cpu: 1
            schema:
              $ref: '#/components/schemas/PostEnvironment'
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                created-environment:
                  summary: Created Environment
                  value:
                    name: production
                    kubernetesNamespace: flink-production
                    created_time: 2024-01-15T10:30:00Z
                    updated_time: 2024-01-15T10:30:00Z
                    flinkApplicationDefaults:
                      spec:
                        flinkConfiguration:
                          taskmanager.numberOfTaskSlots: "4"
                          rest.profiling.enabled: "true"
                        jobManager:
                          resource:
                            memory: 1024m
                            cpu: 1
                        taskManager:
                          resource:
                            memory: 1024m
                            cpu: 1
                    computePoolDefaults:
                      clusterSpec:
                        flinkVersion: v1_19
                        image: confluentinc/cp-flink-sql:1.19-cmf2.5-cp1
                        flinkConfiguration:
                          taskmanager.numberOfTaskSlots: "4"
                    statementDefaults:
                      detached:
                        flinkConfiguration:
                          state.backend.type: hashmap
                      interactive:
                        flinkConfiguration:
                          state.backend.type: hashmap
                    secrets: {}
              schema:
                $ref: '#/components/schemas/Environment'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Environment'
          description: The Environment was successfully created or updated.
        "400":
          content:
            application/json:
              examples:
                validation-error:
                  summary: Validation Error
                  value:
                    errors:
                    - message: 'name: size must be between 4 and 2147483647'
                    - message: Environment's kubernetesNamespace 'fl' does not exist.
                    - message: Environment's kubernetesClusterName 'nonexistent' does
                        not exist.
                immutable-field:
                  summary: Immutable field change rejected
                  value:
                    errors:
                    - message: Environment's kubernetesClusterName cannot be changed
                        from default-k8s-cluster to azure-k8s-cluster because the
                        field is immutable.
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: Bad request. Validation failed. On update, kubernetesNamespace
            and kubernetesClusterName cannot be changed (immutable after creation).
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: The Environment is being deleted together with everything in
            it, so neither it nor anything in it can be created or updated.
        "503":
          content:
            application/json:
              examples:
                metadata-sync-in-progress:
                  summary: Restore after a restart still running
                  value:
                    errors:
                    - message: Managed resources are still being restored after a
                        restart, so changes to environment 'my-env' cannot be accepted
                        yet. Retry shortly.
                cluster-disconnected:
                  summary: Cluster is disconnected
                  value:
                    errors:
                    - message: Kubernetes cluster 'azure-k8s-cluster' is currently
                        DISCONNECTED. Check cluster connectivity and retry. If the
                        cluster has been permanently removed, decommission it and
                        redeploy your resources on another cluster.
                cluster-decommissioned:
                  summary: Cluster is decommissioned
                  value:
                    errors:
                    - message: Kubernetes cluster 'azure-k8s-cluster' is DECOMMISSIONED
                        and cannot accept workloads. Recommission the cluster to restore
                        operations, or create a new environment on an active cluster.
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: Service unavailable, for either of two reasons. On creation,
            the referenced kubernetesClusterName must be in an operational state;
            this is returned when the cluster is DISCONNECTED or DECOMMISSIONED. It
            is also returned while CMF is restoring the resources it manages after
            a restart, during which changes to environments are not accepted — retry
            shortly. The message distinguishes the two, and the progress of a restore
            is reported by the system information endpoint.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: Server error.
      summary: Create or update an Environment
      tags:
      - Environments
  /cmf/api/v1/environments/{envName}:
    delete:
      description: 'Deletes an environment that has no applications, statements or
        compute pools. With `cascade` set to `true`, those are deleted too: a successful
        response then only means the deletion was accepted, and the environment remains
        readable, with `deletionRequestedTimestamp` set in its metadata, until everything
        in it has been deleted. In the meantime its applications, statements, compute
        pools, savepoints, artifacts and secret mappings can''t be created or updated,
        and neither can the environment itself; savepoints that running jobs take
        on their own are deleted along with the rest. With `force` set to `true` as
        well, everything is deleted before the response is returned.'
      operationId: deleteEnvironment
      parameters:
      - description: Name of the Environment to be deleted.
        explode: false
        in: path
        name: envName
        required: true
        schema:
          type: string
        style: simple
      - description: If set to `true`, the platform deletes the environment without
          requiring Kubernetes cluster connectivity. Without `cascade`, it is deleted
          from CMF metadata only, and its Kubernetes resources, such as a service
          account or a secret, might be orphaned. Together with `cascade`, everything
          in the environment is deleted with force too, as described for `cascade`,
          and the environment's Kubernetes resources are deleted on a best-effort
          basis; those that couldn't be are listed in `notCleanedUp`.
        explode: true
        in: query
        name: force
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: 'If set to `true`, the platform also deletes the environment''s
          savepoints, applications, statements and compute pools, and then the environment
          itself. Each is deleted once nothing that needs it is left: a savepoint
          before its application or statement, and a statement before its compute
          pool. A savepoint that failed or was abandoned is deleted whatever its job''s
          state. A savepoint whose job is not running, including a job that failed
          to deploy, or whose application or statement is already gone, is removed
          without deleting its files, and their location is logged. A savepoint still
          being taken, or whose job is starting, restarting or stopping or can''t
          be checked, is kept unless `skipCleanup` is `true`. A delete that is refused
          or fails is retried periodically until it succeeds; the deletion also continues
          after the platform restarts, and sending the request again retries what
          is left immediately. With `force` also set to `true`, everything is deleted
          before the response is returned, without requiring Kubernetes cluster connectivity:
          each resource is removed from CMF whether or not its Kubernetes objects
          can be deleted, which is tried on a best-effort basis. Savepoint files are
          not deleted, though a savepoint that was already being deleted may have
          lost them already. If a resource can''t be removed, the request fails with
          the environment still being deleted. The platform may then go on deleting
          whatever is left, for example after it restarts, but without `force`: that
          needs the Kubernetes cluster, and deletes the files of savepoints whose
          job is running. Sending the request again with `force` deletes the rest
          with force.'
        explode: true
        in: query
        name: cascade
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: Only with `cascade` set to `true` and without `force`. If set
          to `true`, forcibly clears any finalizers blocking the deletion of the environment's
          applications, statements on shared compute pools, and shared compute pools
          that are already being deleted. It also removes its savepoints that are
          already being deleted without waiting for that deletion to finish, so their
          files may already be gone, and logs where those files are. If the environment
          was already being deleted before this request, it also removes savepoints
          that are still being taken, or whose job is starting, restarting or stopping
          or can't be checked, without deleting their files, and logs where they are.
          Only use this if the environment has remained in a pending-deletion state
          for longer than expected. This skips any cleanup those finalizers would
          otherwise have performed (for example, taking a final savepoint or cancelling
          a statement's Flink job), so it should only be used once you've confirmed
          the resources are genuinely stuck rather than still in the middle of a normal,
          in-progress cleanup.
        explode: true
        in: query
        name: skipCleanup
        required: false
        schema:
          default: false
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentDeletionResult'
            application/yaml:
              schema:
                $ref: '#/components/schemas/EnvironmentDeletionResult'
          description: Environment and everything in it deleted. Only returned when
            both `cascade` and `force` are `true`. The body lists what was deleted,
            including the paths of the savepoints, whose files are not deleted, and
            the Kubernetes objects that might still exist because they couldn't be
            deleted or were already being deleted.
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentDeletionResult'
            application/yaml:
              schema:
                $ref: '#/components/schemas/EnvironmentDeletionResult'
          description: Deletion request accepted. Only returned when `cascade` is
            `true` and `force` isn't. The body lists what will be deleted; sending
            the request again lists what is still left. Savepoints that running jobs
            take on their own while the deletion runs are deleted too, but aren't
            listed.
        "204":
          description: Environment found and deleted.
        "304":
          description: Not modified.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: '`skipCleanup` was set to `true` without `cascade`, or together
            with `force`.'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: Both `cascade` and `force` are `true`, and another such request
            is already deleting the environment.
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: 'The environment still has resources that must be deleted first:
            its artifacts, the databases, functions, models, tables and views created
            in its catalog, and, unless `cascade` is `true`, its applications, statements
            and compute pools. With both `cascade` and `force`, also returned when
            a resource in it couldn''t be removed. The message then also names the
            Kubernetes objects that the resources already removed might have left,
            and sending the request again retries whatever is left.'
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: Service unavailable, for either of two reasons. Unless `force`
            is `true`, the environment's Kubernetes cluster must be in an operational
            state; this is returned when the cluster is DISCONNECTED or DECOMMISSIONED.
            It is also returned while CMF is restoring the resources it manages after
            a restart, during which environments can't be deleted — retry shortly.
            The message distinguishes the two, and the progress of a restore is reported
            by the system information endpoint.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: Server error.
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: Environment not found.
      tags:
      - Environments
    get:
      operationId: getEnvironment
      parameters:
      - description: Name of the Environment to be retrieved.
        explode: false
        in: path
        name: envName
        required: true
        schema:
          type: string
        style: simple
      - description: Whether to include resource summary in the response.
        explode: true
        in: query
        name: include-resource-information
        required: false
        schema:
          default: false
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Environment'
          description: Environment found and returned.
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: Environment not found.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: Server error.
      summary: Get/Describe an environment with the given name.
      tags:
      - Environments
  /cmf/api/v1/environments/{envName}/applications:
    get:
      operationId: getApplications
      parameters:
      - description: Zero-based page index (0..N)
        explode: true
        in: query
        name: page
        required: false
        schema:
          type: integer
        style: form
      - description: The size of the page to be returned
        explode: true
        in: query
        name: size
        required: false
        schema:
          type: integer
        style: form
      - description: |-
          Sorting criteria in the format: property,(asc|desc). Default sort order is ascending.
          Supported properties: name, metadata.name, creationTimestamp, metadata.creationTimestamp,
          updateTimestamp, metadata.updateTimestamp.
          Note: updateTimestamp sorts by the most recent spec update time. The displayed
          metadata.updateTimestamp may differ as it reflects the latest of spec or status changes.
        explode: true
        in: query
        name: sort
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      - description: Whether to include resource summary in the response.
        explode: true
        in: query
        name: include-resource-information
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: |-
          Filter query string with comma-separated expressions. Supports:
          - Name filtering: name=foo*bar (wildcards allowed)
          - Label equality: labels.key = value or labels.key != value
          - Label set-based: labels.key in (value1, value2) or labels.key notin (value1, value2)
          - Label existence: labels.key (exists) or !labels.key (does not exist)
          - State filtering (Applications only): state=RUNNING or state in (RUNNING, FAILED) or state notin (RUNNING, FAILED)
          - Status error filtering (Applications only): status.error (the Application's status reports an error, i.e. status.error is set and not blank) or !status.error (it reports none). An Application can report an error while its state is not FAILED, for example while its job keeps restarting.
          - Phase filtering (Statements and ComputePools): phase=PENDING or phase in (PENDING, RUNNING) or phase notin (PENDING, RUNNING)
          - Type filtering (Events only): type=CMF_STATUS or type in (CMF_STATUS, JOB_STATUS) or type notin (CMF_STATUS, JOB_STATUS)
          - Severity filtering (Events only): severity=WARNING or severity in (INFO, WARNING) or severity notin (WARNING). Values: INFO, WARNING. Severity is independent of type, so the two can be combined to narrow further (e.g. type=JOB_STATUS,severity=WARNING). An unrecognized severity value is rejected with HTTP 400.
          - Cluster status filtering (Environments only): clusterStatus=CONNECTED or clusterStatus in (CONNECTED, DISCONNECTED) or clusterStatus notin (CONNECTED, DISCONNECTED). Values match the effective state of the backing Kubernetes cluster (CONNECTED, DISCONNECTED, DECOMMISSIONED).
          - Source filtering (Savepoints only): source=MANUAL or source in (MANUAL, SCHEDULE) or source notin (UPGRADE). Identifies how the savepoint was created. Values: MANUAL (triggered via API, CLI, or UI), UPGRADE (created during an application upgrade), SCHEDULE (created by a periodic savepoint schedule). An unrecognized source value is rejected with HTTP 400 (unlike state, which simply returns no matches for an unknown value).
          Example: ?filter=name=foo*bar,labels.environment in (production, qa),!labels.development
          Example (with state): ?filter=name=prod*,state in (RUNNING, FAILED)
          Example (with status.error): ?filter=status.error,labels.team=payments
          Example (with phase): ?filter=name=my-stmt*,phase in (PENDING, RUNNING)
          Example (with type): ?filter=type=CMF_STATUS or ?filter=type in (CMF_STATUS, JOB_STATUS)
          Example (with severity): ?filter=severity=WARNING or ?filter=type=JOB_STATUS,severity=WARNING
          Example (with clusterStatus): ?filter=clusterStatus in (CONNECTED, DISCONNECTED)
          Example (with source): ?filter=state=COMPLETED,source=SCHEDULE
        explode: true
        in: query
        name: filter
        required: false
        schema:
          type: string
        style: form
      - description: |-
          Comma-separated list of field paths to include in the response. Supports nested fields using dot notation.
          Always includes apiVersion and kind fields even if not explicitly requested.
          Example: ?fields=metadata.name,metadata.createdTimestamp,status.phase
        explode: true
        in: query
        name: fields
        required: false
        schema:
          type: string
        style: form
      - description: Name of the Environment
        explode: false
        in: path
        name: envName
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationsPage'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ApplicationsPage'
          description: Application found and returned.
        "304":
          description: Not modified.
          headers:
            ETag:
              description: An ID for this version of the response.
              explode: false
              schema:
                type: string
              style: simple
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
