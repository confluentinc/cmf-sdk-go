    AllStatementDefaults_1:
      description: the defaults for detached and interactive Statements
      properties:
        detached:
          $ref: '#/components/schemas/StatementDefaults'
        interactive:
          $ref: '#/components/schemas/StatementDefaults'
      title: AllStatementDefaults
      type: object
    SavepointRetention:
      description: |
        GFS-style retention. A savepoint survives cleanup if any configured rule keeps it.
        keepLast and keepWithin are absolute floors; the other fields are sliding
        calendar-aligned windows in the schedule's timezone.
      properties:
        keepLast:
          description: Keep the N most recently completed periodic savepoints.
          format: int32
          minimum: 1
          type: integer
        keepWithin:
          description: |
            ISO-8601 duration; keep every completed periodic savepoint taken within this
            duration of now. Examples: "PT24H", "P7D".
          type: string
        keepHourly:
          description: Keep the latest periodic savepoint per calendar hour for the
            most recent N hours.
          format: int32
          minimum: 1
          type: integer
        keepDaily:
          description: Keep the latest periodic savepoint per calendar day for the
            most recent N days.
          format: int32
          minimum: 1
          type: integer
        keepWeekly:
          description: Keep the latest periodic savepoint per ISO week for the most
            recent N weeks.
          format: int32
          minimum: 1
          type: integer
        keepMonthly:
          description: Keep the latest periodic savepoint per calendar month for the
            most recent N months.
          format: int32
          minimum: 1
          type: integer
        keepYearly:
          description: Keep the latest periodic savepoint per calendar year for the
            most recent N years.
          format: int32
          minimum: 1
          type: integer
      title: SavepointRetention
      type: object
    SavepointsBulkDeleteResult_failures:
