  /cmf/api/v1/environments/{envName}/compute-pools/{computePoolName}/pod-logs:
    get:
      description: |-
        Returns the most recent log output of a single JobManager or TaskManager pod of a shared compute pool's session cluster, together with the names of all pods of that component so a caller can request the logs of a specific one. This is a point-in-time snapshot, not a live stream.

        Only shared compute pools run a session cluster with pods of their own; a dedicated compute pool has none, so this returns 400 for one.

        Requires the AccessWebUI permission on the compute pool, the same permission as the compute pool's Flink web UI. Viewing the compute pool is not enough, because the session cluster's logs contain the output of every statement on the pool.

        For a live tail that stays open and delivers each new line as the container writes it, use `GET /cmf/api/v1/environments/{envName}/compute-pools/{computePoolName}/pod-logs/stream`. It takes the same `component` (required), `podName`, `container`, `tailLines`, `sinceTime` and `timestamps` parameters, requires the same permission, and returns a plain-text stream rather than a JSON snapshot.

        Log retrieval requires a connection to the Kubernetes cluster the compute pool runs on, and can be turned off entirely by the operator, in which case this endpoint responds with 404.
      operationId: getComputePoolPodLogs
      parameters:
      - description: Name of the Environment
        explode: false
        in: path
        name: envName
        required: true
        schema:
          type: string
        style: simple
      - description: Name of the compute pool
        explode: false
        in: path
        name: computePoolName
        required: true
        schema:
          type: string
        style: simple
      - description: Which component of the Flink cluster to read the logs of.
        explode: true
        in: query
        name: component
        required: true
        schema:
          enum:
          - jobmanager
          - taskmanager
          type: string
        style: form
      - description: Name of the pod to read the logs of. Must be one of the pods
          reported in `availablePods`. When omitted, the logs of the first available
          pod of the requested component are returned.
        explode: true
        in: query
        name: podName
        required: false
        schema:
          type: string
        style: form
      - description: Name of the container within the pod to read the logs of. Must
          be one of the containers of that pod. When omitted, the pod's main Flink
          container is used.
        explode: true
        in: query
        name: container
        required: false
        schema:
          type: string
        style: form
      - description: Number of most recent log lines to return. Ignored when `fromStart`
          is set.
        explode: true
        in: query
        name: tailLines
        required: false
        schema:
          default: 200
          maximum: 20000
          minimum: 1
          type: integer
        style: form
      - description: Only return log lines written within the last N seconds. The
          `tailLines` cap still applies, so a wide window can still be truncated.
        explode: true
        in: query
        name: sinceSeconds
        required: false
        schema:
          minimum: 0
          type: integer
        style: form
      - description: Only return log lines written at or after this timestamp (RFC
          3339). Use it together with `timestamps` to continue reading where a previous
          response ended. Mutually exclusive with `sinceSeconds`.
        explode: true
        in: query
        name: sinceTime
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: Prefix every returned line with the RFC 3339 timestamp at which
          the container wrote it.
        explode: true
        in: query
        name: timestamps
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: Return the log from the oldest line the Kubernetes cluster still
          retains instead of the most recent ones. The response is capped in size;
          `truncated` reports whether it hit that cap.
        explode: true
        in: query
        name: fromStart
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: Read the logs of the previous, terminated container instead of
          the running one. Use this to inspect why a container crashed.
        explode: true
        in: query
        name: previous
        required: false
        schema:
          default: false
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubernetesPodLogs'
            application/yaml:
              schema:
                $ref: '#/components/schemas/KubernetesPodLogs'
          description: Logs found and returned.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: The request was malformed, or the compute pool is dedicated
            (it has no pods of its own).
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: The caller does not have the AccessWebUI permission on the
            compute pool.
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: The platform itself is not permitted to read the pod's logs
            on the Kubernetes cluster.
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: Environment, compute pool or pod not found, the compute pool
            currently has no pods of the requested component, a Flink cluster with
            the compute pool's name that is not the pool's own session cluster runs
            in its namespace, or log retrieval is disabled.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: Server error.
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: The Kubernetes cluster the compute pool runs on is currently
            unreachable.
      summary: Get a snapshot of the container logs of one of the compute pool's session
        cluster pods
      tags:
      - SQL
