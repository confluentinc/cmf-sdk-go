      title: KubernetesClustersByStateSummary
      type: object
    KubernetesClusterStatus:
      description: Status of the Kubernetes cluster.
      properties:
        state:
          description: |-
            The effective state of the cluster. CONNECTED when the cluster is reachable,
            DISCONNECTED when unreachable, or DECOMMISSIONED when intentionally taken offline.
          enum:
          - CONNECTED
          - DISCONNECTED
          - DECOMMISSIONED
          type: string
        message:
          description: A human-readable message providing details about the current
            state (e.g., connection error details).
          type: string
        lastHeartbeatTimestamp:
          description: Timestamp of the last successful heartbeat check.
          format: date-time
          type: string
        kubernetesVersion:
          description: The Kubernetes server version reported by the cluster (e.g.,
            "v1.28.3"). Only available when the cluster is CONNECTED.
          type: string
        environments:
          description: |-
            Names of environments that reference this cluster via spec.kubernetesClusterName.
            Always empty in Environment.status.kubernetesCluster.
          items:
            type: string
          type: array
      readOnly: true
      title: KubernetesClusterStatus
      type: object
    inline_object:
      properties:
        artifact:
          $ref: '#/components/schemas/Artifact'
