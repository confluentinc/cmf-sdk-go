  /cmf/api/v1/catalogs/kafka:
    get:
      operationId: getKafkaCatalogs
      parameters:
      - description: Zero-based page index (0..N)
        explode: true
        in: query
        name: page
        required: false
        schema:
          type: integer
        style: form
      - description: The size of the page to be returned
        explode: true
        in: query
        name: size
        required: false
        schema:
          type: integer
        style: form
      - description: |-
          Sorting criteria in the format: property,(asc|desc). Default sort order is ascending.
          Multiple sort criteria are supported.
        explode: true
        in: query
        name: sort
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      - description: |-
          Filter query string with comma-separated expressions. Supports:
          - Name filtering: name=foo*bar (wildcards allowed)
          - Label equality: labels.key = value or labels.key != value
          - Label set-based: labels.key in (value1, value2) or labels.key notin (value1, value2)
          - Label existence: labels.key (exists) or !labels.key (does not exist)
          - State filtering (Applications only): state=RUNNING or state in (RUNNING, FAILED) or state notin (RUNNING, FAILED)
          - Phase filtering (Statements and ComputePools): phase=PENDING or phase in (PENDING, RUNNING) or phase notin (PENDING, RUNNING)
          - Type filtering (Events only): type=CMF_STATUS or type in (CMF_STATUS, JOB_STATUS) or type notin (CMF_STATUS, JOB_STATUS)
          - Cluster status filtering (Environments only): clusterStatus=CONNECTED or clusterStatus in (CONNECTED, DISCONNECTED) or clusterStatus notin (CONNECTED, DISCONNECTED). Values match the effective state of the backing Kubernetes cluster (CONNECTED, DISCONNECTED, DECOMMISSIONED).
          - Source filtering (Savepoints only): source=MANUAL or source in (MANUAL, SCHEDULE) or source notin (UPGRADE). Identifies how the savepoint was created. Values: MANUAL (triggered via API, CLI, or UI), UPGRADE (created during an application upgrade), SCHEDULE (created by a periodic savepoint schedule). An unrecognized source value is rejected with HTTP 400 (unlike state, which simply returns no matches for an unknown value).
          Example: ?filter=name=foo*bar,labels.environment in (production, qa),!labels.development
          Example (with state): ?filter=name=prod*,state in (RUNNING, FAILED)
          Example (with phase): ?filter=name=my-stmt*,phase in (PENDING, RUNNING)
          Example (with type): ?filter=type=CMF_STATUS or ?filter=type in (CMF_STATUS, JOB_STATUS)
          Example (with clusterStatus): ?filter=clusterStatus in (CONNECTED, DISCONNECTED)
          Example (with source): ?filter=state=COMPLETED,source=SCHEDULE
        explode: true
        in: query
        name: filter
        required: false
        schema:
          type: string
        style: form
      - description: |-
          Search term to match against fields specified in searchScope.
          Note: Both search and searchScope must be provided together. If only one is provided, the request will be rejected.
          Example: ?search=foo&searchScope=name,kubernetesNamespace
        explode: true
        in: query
        name: search
        required: false
        schema:
          type: string
        style: form
      - description: |-
          Comma-separated list of fields to search in. Must be provided together with the search parameter.
          Unsupported field names will result in a 400 Bad Request.
          For Environments: supported fields are name, kubernetesNamespace.
          For Statements: supported fields are name, statement.
          For Events: supported fields are message, flinkApplicationInstance.
          For Secrets: supported fields are name, environments.
          For Kafka Catalogs: supported fields are name.
          When multiple fields are specified, the search uses OR logic.
          Example (Environments): ?search=foo&searchScope=name,kubernetesNamespace means (name contains foo OR kubernetesNamespace contains foo)
          Example (Statements): ?search=SELECT&searchScope=name,statement means (name contains SELECT OR statement contains SELECT)
          Example (Events): ?search=RUNNING&searchScope=message,flinkApplicationInstance means (message contains RUNNING OR flinkApplicationInstance equals RUNNING)
        explode: true
        in: query
        name: searchScope
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KafkaCatalogsPage'
            application/yaml:
              schema:
                $ref: '#/components/schemas/KafkaCatalogsPage'
          description: Kafka Catalogs found and returned.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: Bad request.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: Server error.
      summary: Retrieve a paginated list of Kafka Catalogs
      tags:
      - SQL
      x-spring-paginated: true
    post:
      operationId: createKafkaCatalog
      requestBody:
        content:
          application/json:
