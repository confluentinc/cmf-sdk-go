    ComputePoolSpec:
      description: Spec for ComputePool
      properties:
        type:
          description: Type of the ComputePool
          enum:
          - DEDICATED
          - SHARED
          type: string
        state:
          description: |-
            Desired state of the compute pool. Can only be specified for shared
            compute pools. Defaults to RUNNING if not specified.
          enum:
          - RUNNING
          - SUSPENDED
          type: string
        allowedWorkloadKinds:
          description: |-
            Reserved for a future release. Do not set this field. On a shared
            compute pool it limits which kinds of workload the pool accepts, and its
            behavior may change without notice. It cannot be set on dedicated
            compute pools.
          items:
            enum:
            - STATEMENT
            - APPLICATION
            type: string
          nullable: true
          type: array
          x-field-extra-annotation: '@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)'
        allowedJarUriPrefixes:
          description: |-
            Reserved for a future release. Do not set this field. On a shared
            compute pool whose allowedWorkloadKinds includes APPLICATION it lists
            the URI prefixes that Application jars may be fetched from, and its
            behavior may change without notice. It cannot be set on other compute
            pools, and is cleared when APPLICATION is removed from
            allowedWorkloadKinds.
          items:
            type: string
          nullable: true
          type: array
          x-field-extra-annotation: '@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)'
        clusterSpec:
          description: |
            Cluster Spec

            Some keys in "flinkConfiguration" are reserved and cannot be set. For every
            compute pool, these are `web.submit.jar-sources` and every key beginning with
            `kubernetes.operator.cmf.`. For a shared compute pool, they also include
            `pipeline.jars`, `pipeline.classpaths`, and every key beginning with
            `user.artifacts.` except `user.artifacts.max-concurrent-fetches`,
            `user.artifacts.max-size`, `user.artifacts.fetch-timeout`,
            `user.artifacts.base-dir`, `user.artifacts.http-headers` and
            `user.artifacts.raw-http-enabled`.
            A compute pool that sets one is rejected with an error naming the key.
          format: yamlorjson
          type: object
        cpFlinkSqlVersion:
          description: CP Flink SQL version that statements on this compute pool are
            compiled against. Releases for CMF 2.5 and later have the format `<major>.<minor>-cmf<X.Y>-cp<build>`,
            for example `1.19-cmf2.5-cp1`, where `<X.Y>` is the CMF minor version
            and `<build>` counts from 1 within it. The earlier releases `1.19-cp1`
            to `1.19-cp12` are also accepted, and are older than every other 1.19
            version. A release candidate, for example `1.19-rc1-cmf2.5-cp1`, is the
            same version as its release. No other format is accepted. A compiler compiles
            for the versions of its Flink line up to every build of its own CMF minor
            version. A version of a later CMF minor version than this one is rejected,
            and so is a version older than the oldest version of its Flink line that
            CMF supports (`1.19-cp8` for 1.19, `2.3-cmf2.5-cp1` for 2.3), and a version
            of another Flink major version than the compute pool's `clusterSpec.flinkVersion`.
            Only used when CMF is configured with shared SQL compilers or compile
            workers. Creating a statement fails if no configured compiler supports
            this version, or if this version has another Flink major version than
            the compute pool's Flink version. When unset, CMF uses the version in
            a `cp-flink-sql` image tag if a configured compiler supports it and it
            has the compute pool's Flink major version, and otherwise a compiler matching
            the compute pool's Flink version. An update that leaves this field out
            keeps it; an empty string clears it.
          example: 1.19-cmf2.5-cp1
          pattern: ^(\d+\.\d+(-rc\d+)?-(cp\d+|cmf\d+\.\d+-cp\d+))?$
          type: string
          x-field-extra-annotation: '@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)'
      required:
      - clusterSpec
      - type
      title: ComputePoolSpec
      type: object
