          format: int32
          type: integer
        properties:
          additionalProperties:
            type: string
          description: sql mode - the statement properties to run the statement with,
            as in a Statement's spec.properties.
          type: object
        sqlKind:
          description: sql mode - the kind of the statement, with the values of a
            statement's `status.traits.sqlKind`, for example SELECT, SHOW_TABLES,
            CREATE_TABLE or INSERT_INTO. INSERT_INTO and EXECUTE_STATEMENT_SET run
            in the background, return no rows, and are never an agent step. Absent
            when the statement does not parse or when CMF does not support it. Clients
            should run only SELECT, SHOW_* and DESCRIBE* statements without the user's
            approval.
          example: SELECT
          type: string
        skills:
          description: The reference docs the assistant loaded to reply to this turn,
            for example flink-sql-config (the SQL configuration options of the compute
            pool's Flink version). They stay available to the assistant for the rest
            of the conversation.
          items:
            type: string
          type: array
        question:
          $ref: '#/components/schemas/SqlAssistantQuestion'
        suggestedTitle:
          description: A model-suggested conversation title. Omitted once spec.title
            is set on the conversation.
          type: string
        model:
          description: The model that produced this turn.
          type: string
        promptTokens:
          description: The input (prompt) token count the model reported for this
            turn.
          format: int32
          type: integer
      readOnly: true
      title: SqlAssistantTurnStatus
      type: object
