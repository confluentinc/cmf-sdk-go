    C3Configuration:
      description: Effective runtime configuration of the CMF instance.
      example:
        kind: kind
        status:
          configurationProperties:
          - originType: CONFIG_FILE
            origin: origin
            sensitive: true
            value: value
            key: key
          - originType: CONFIG_FILE
            origin: origin
            sensitive: true
            value: value
            key: key
      properties:
        kind:
