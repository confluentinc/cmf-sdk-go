            (cmf.sql.assistant.enabled).
          type: boolean
        aiEnabled:
          description: Whether a model is configured. When false the tab is a manual
            SQL shell.
          type: boolean
        model:
          description: The configured model. Absent when no model is configured.
          type: string
        inputTokenLimit:
          description: The configured model's context-window size, used as the token-gauge
            denominator. Absent when not configured.
          format: int64
          type: integer
        maxResultRows:
          description: The maximum rows a result turn may carry (cmf.sql.assistant.max-result-rows);
            the client caps a collected result to this before posting it.
          format: int64
          type: integer
      title: C3SqlAssistantFeature
      type: object
      x-class-extra-annotation: '@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)'
