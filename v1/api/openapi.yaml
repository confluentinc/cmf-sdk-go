    FlinkApplicationAutoscaler:
      description: The autoscaler state and effective options for a Flink Application
      example:
        metadata:
          updateTimestamp: 2000-01-23T04:56:07.000+00:00
        apiVersion: apiVersion
        kind: kind
        status:
          scalingEvents:
          - vertexId: vertexId
            fromParallelism: 5
            toParallelism: 5
            evaluatedMetrics:
              TRUE_PROCESSING_RATE: 27410.0
              TARGET_DATA_RATE: 27930.0
              SCALE_UP_RATE_THRESHOLD: 24180.0
            timestamp: 2000-01-23T04:56:07.000+00:00
          - vertexId: vertexId
            fromParallelism: 5
            toParallelism: 5
            evaluatedMetrics:
              TRUE_PROCESSING_RATE: 27410.0
              TARGET_DATA_RATE: 27930.0
              SCALE_UP_RATE_THRESHOLD: 24180.0
            timestamp: 2000-01-23T04:56:07.000+00:00
          parallelismOverrides:
            key: parallelismOverrides
          jobRunningSince: 2000-01-23T04:56:07.000+00:00
          metricHistory:
          - vertices:
              key:
                key: 6.027456183070403
            global:
              key: 1.4658129805029452
            timestamp: 2000-01-23T04:56:07.000+00:00
          - vertices:
              key:
                key: 6.027456183070403
            global:
              key: 1.4658129805029452
            timestamp: 2000-01-23T04:56:07.000+00:00
          options:
            key: options
          scalingTracking:
            key: '{}'
          scalingEnabled: true
          delayedScaleDown:
            vertices:
              key:
                firstTriggerTime: 2000-01-23T04:56:07.000+00:00
                recommendations:
                - parallelism: 0
                  outsideUtilizationBound: true
                  triggerTime: 2000-01-23T04:56:07.000+00:00
                - parallelism: 0
                  outsideUtilizationBound: true
                  triggerTime: 2000-01-23T04:56:07.000+00:00
          state: EVALUATING
          windowFullAt: 2000-01-23T04:56:07.000+00:00
          message: message
          enabled: true
      properties:
        apiVersion:
          title: API version for the autoscaler state - set to v1alpha1
          type: string
        kind:
          title: Kind of resource - set to FlinkApplicationAutoscaler
          type: string
        metadata:
          $ref: '#/components/schemas/AutoscalerMetadata'
        status:
          $ref: '#/components/schemas/AutoscalerStatus'
      required:
      - apiVersion
      - kind
      - metadata
      - status
      title: FlinkApplicationAutoscaler
      type: object
    AutoscalerDelayedScaleDown:
      description: |
        A scale-down the autoscaler has decided but is holding until its scale-down interval elapses. While a scale-down is held, the job keeps its current parallelism and the autoscaler reports no change.
      example:
        vertices:
          key:
            firstTriggerTime: 2000-01-23T04:56:07.000+00:00
            recommendations:
            - parallelism: 0
              outsideUtilizationBound: true
              triggerTime: 2000-01-23T04:56:07.000+00:00
            - parallelism: 0
              outsideUtilizationBound: true
              triggerTime: 2000-01-23T04:56:07.000+00:00
      properties:
        vertices:
          additionalProperties:
            $ref: '#/components/schemas/AutoscalerDelayedVertex'
          description: Held scale-downs, as a map of job vertex id to the decision
            for that vertex
          type: object
      title: AutoscalerDelayedScaleDown
      type: object
    AutoscalerDelayedVertex:
      description: A held scale-down for a single job vertex
      example:
        firstTriggerTime: 2000-01-23T04:56:07.000+00:00
        recommendations:
        - parallelism: 0
          outsideUtilizationBound: true
          triggerTime: 2000-01-23T04:56:07.000+00:00
        - parallelism: 0
          outsideUtilizationBound: true
          triggerTime: 2000-01-23T04:56:07.000+00:00
      properties:
        firstTriggerTime:
          description: |
            When the autoscaler first wanted to scale this vertex down. The scale-down becomes eligible one scale-down interval after this time.
          format: date-time
          type: string
        recommendations:
          default: []
          description: The parallelism values recommended for this vertex while the
            scale-down is held
          items:
            $ref: '#/components/schemas/AutoscalerParallelismRecommendation'
          type: array
      title: AutoscalerDelayedVertex
      type: object
    AutoscalerParallelismRecommendation:
      description: A parallelism the autoscaler recommended for a job vertex at a
        point in time
      example:
        parallelism: 0
        outsideUtilizationBound: true
        triggerTime: 2000-01-23T04:56:07.000+00:00
      properties:
        triggerTime:
          description: When this parallelism was recommended
          format: date-time
          type: string
        parallelism:
          description: The recommended parallelism
          format: int32
          type: integer
        outsideUtilizationBound:
          description: |
            Whether the measured utilization was outside the configured target band when this recommendation was made.
          type: boolean
      title: AutoscalerParallelismRecommendation
      type: object
    AutoscalerScalingEvent:
      description: A parallelism change the autoscaler made to one job vertex
      example:
        vertexId: vertexId
        fromParallelism: 5
        toParallelism: 5
        evaluatedMetrics:
          TRUE_PROCESSING_RATE: 27410.0
          TARGET_DATA_RATE: 27930.0
          SCALE_UP_RATE_THRESHOLD: 24180.0
        timestamp: 2000-01-23T04:56:07.000+00:00
      properties:
        timestamp:
          description: When the autoscaler made the change
          format: date-time
          type: string
        vertexId:
          description: The job vertex whose parallelism changed
          type: string
        fromParallelism:
          description: The parallelism the vertex ran at before the change
          format: int32
          type: integer
        toParallelism:
          description: The parallelism the autoscaler changed the vertex to
          format: int32
          type: integer
        evaluatedMetrics:
          additionalProperties:
            format: double
            nullable: true
            type: number
          description: |
            The metrics the autoscaler evaluated when it took this decision, as a map of metric name to value (for example `TRUE_PROCESSING_RATE` or `SCALE_UP_RATE_THRESHOLD`). These are a snapshot taken at the moment of the decision, not live values, and are recorded only when a decision is taken. A value the autoscaler reports as infinite or undefined is returned as null, because those are not representable in JSON.
          example:
            TRUE_PROCESSING_RATE: 27410.0
            TARGET_DATA_RATE: 27930.0
            SCALE_UP_RATE_THRESHOLD: 24180.0
          type: object
      title: AutoscalerScalingEvent
      type: object
    AutoscalerMetricSample:
      description: One set of metrics collected by the autoscaler at a point in time
      example:
        vertices:
          key:
            key: 6.027456183070403
        global:
          key: 1.4658129805029452
        timestamp: 2000-01-23T04:56:07.000+00:00
      properties:
        timestamp:
          description: When the sample was collected
          format: date-time
          type: string
        vertices:
          additionalProperties:
            additionalProperties:
              format: double
              nullable: true
              type: number
            type: object
          description: |
            Per job vertex metrics, as a map of job vertex id to a map of metric name to value (for example `LOAD` or `TRUE_PROCESSING_RATE`). A value the autoscaler reports as infinite or undefined is returned as null, because those are not representable in JSON.
          type: object
        global:
          additionalProperties:
            format: double
            nullable: true
            type: number
          description: |
            Job-wide metrics such as heap usage and garbage collection pressure, as a map of metric name to value. Infinite or undefined values are returned as null.
          type: object
      title: AutoscalerMetricSample
      type: object
