                          provider: azure
                      spec:
                        lifecycleState: ACTIVE
                      status:
                        state: CONNECTED
                        lastHeartbeatTimestamp: 2026-02-16T10:30:00Z
              schema:
                $ref: '#/components/schemas/KubernetesClustersPage'
            application/yaml:
              schema:
                $ref: '#/components/schemas/KubernetesClustersPage'
          description: List of Kubernetes clusters. If no clusters are found, an empty
