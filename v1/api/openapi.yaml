      type: object
    ArtifactStatus:
      description: Server-managed status for a specific version of the Artifact.
      properties:
        version:
          description: Version number (starts at 1, auto-incremented on each new binary
            upload).
          format: int32
          type: integer
        creationTimestamp:
          description: Timestamp when this version was created (when its binary was
            uploaded). For version 1 this equals the Artifact's `metadata.creationTimestamp`;
            later versions each carry their own upload time.
          readOnly: true
          type: string
        path:
          description: Full path to the artifact in blob storage.
          type: string
        size:
          description: File size in bytes. Omitted from the response while the version
            is in `UPLOADING` phase.
          format: int64
          type: integer
        checksum:
          description: SHA-256 checksum of the artifact content (e.g. `sha256:abc...`).
            Omitted from the response while the version is in `UPLOADING` phase.
          type: string
        phase:
          description: 'Lifecycle phase of this version. `UPLOADING`: content is still
            being uploaded. `READY`: content is uploaded and available. `FILE_MISSING`:
            the backing file is absent from storage. `STORE_UNREACHABLE`: artifact
            storage could not be reached, so the file''s presence could not be verified.'
          enum:
          - UPLOADING
          - READY
          - FILE_MISSING
          - STORE_UNREACHABLE
          type: string
        message:
          description: Human-readable status message, populated on error states such
            as `FILE_MISSING` and `STORE_UNREACHABLE`.
          type: string
      title: ArtifactStatus
      type: object
