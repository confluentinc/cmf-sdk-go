  /cmf/api/v1/c3/auth-config:
    get:
      description: |-
        Returns the auth configuration the cmf-ui single-page app needs to decide
        whether and how to log in. This endpoint is intentionally unauthenticated so
        the SPA can read it before it holds a token.
      operationId: getAuthConfig
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfig'
            application/yaml:
              schema:
                $ref: '#/components/schemas/AuthConfig'
          description: Auth configuration retrieved successfully.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: Server error.
      summary: Discover the CMF authentication/authorization configuration.
      tags:
      - C3
  /cmf/api/v1/c3/whoami:
    get:
      description: |-
        Returns the principal CMF authenticated the current request as -- the JWT/OIDC/Basic
        subject or, for mTLS, the client-certificate subject mapped to a principal. Lets the
        cmf-ui SPA label the signed-in user even when there is no token to decode (mTLS), where
        the principal exists only server-side. Requires authentication when authentication is
        enabled; when authentication is disabled the endpoint is still reachable and returns a
        null principal.
      operationId: getWhoami
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhoAmi'
            application/yaml:
              schema:
                $ref: '#/components/schemas/WhoAmi'
          description: Current principal returned successfully.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: Server error.
      summary: Return the authenticated principal's identity.
      tags:
      - C3
  /cmf/api/v1/c3/features:
    get:
      description: |-
        Reports which optional capabilities this CMF deployment has enabled, so the cmf-ui
        single-page app can adapt what it offers before it calls a feature's endpoints -- for
        example, showing an explanatory screen for a disabled feature instead of letting its
        views fail. Each flag reflects a deployment-wide configuration switch, not the caller's
        permissions.
      operationId: getFeatures
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/C3Features'
            application/yaml:
              schema:
                $ref: '#/components/schemas/C3Features'
          description: Feature configuration retrieved successfully.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: Server error.
      summary: Discover which optional CMF UI features the deployment exposes.
      tags:
      - C3
  /cmf/api/v1/c3/flink-config-references/{flinkVersionName}:
    get:
      description: |-
        Lists the configuration options that Apache Flink documents for a Flink version,
        followed by the Flink Kubernetes Operator options that can be set in a resource's
        flinkConfiguration. The CMF UI uses it to suggest and explain configuration keys. The
        reference comes from the documentation of the Flink release line, not of a specific
        patch release.
      operationId: getFlinkConfigReference
      parameters:
      - description: The Flink version, as in the flinkVersion of a compute pool's
          or application's spec, for example v1_19.
        explode: false
        in: path
        name: flinkVersionName
        required: true
        schema:
          example: v1_19
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlinkConfigReference'
            application/yaml:
              schema:
                $ref: '#/components/schemas/FlinkConfigReference'
          description: Configuration reference retrieved successfully.
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: CMF has no configuration reference for this Flink version.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/RestError'
          description: Server error.
      summary: Retrieve the reference of the Flink configuration options of a Flink
        version.
      tags:
      - C3
